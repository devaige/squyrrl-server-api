# =============================================================================
# Squyrrl API — 大陆中继入口（api.squyrrl.cn → 新加坡源站，ADR-079）
#
# 装在**大陆服务器**上，不是新加坡那台。大陆服务器只跑 nginx：没有容器、源码、.env，
# 不连数据库、不参与 Actions 部署。跨境只发生在本文件这一跳 HTTP 上。
#
# 链路：客户端 ──HTTPS──▶ 本机（Let's Encrypt 证书）──双向 TLS、长连接──▶ 新加坡 nginx 的
#       relay.squyrrl.internal 块（server/api/nginx.conf 末尾）──▶ API
#
# **不经 Cloudflare。** api.squyrrl.com 是橙云，大陆机房连 Cloudflare 同样会被调度到美西，
# 跨境最差的那一段原样还在；所以 upstream 直接写源站 IP。代价是 Cloudflare 上挂在
# api.squyrrl.com 的东西这条路一律碰不到 —— OTP 限流 Worker 就是其中之一，下方用 limit_req 补上。
#
# 安装（conf.d 在 Debian 系与 RHEL 系的官方包里都会被 include）：
#   sudo cp nginx-cn.conf /etc/nginx/conf.d/api.squyrrl.cn.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 本文件写全了 443 块，**不要**用 certbot --nginx 安装证书：那会就地改写本文件，
# 下次重新 cp 仓库版本时把它的改动抹掉（ADR-053 记过这个坑）。证书用 certonly --webroot 签，
# 续期走下方 80 块的 ACME 路径，cp → reload 始终幂等。
#
# 依赖的主机文件（均不入库，签发与安装顺序见 docs/readme/16-cn-relay.md）：
#   /etc/nginx/squyrrl/origin-upstream.conf   一行 `server <新加坡源站 IP>:443;`
#       源站 IP 不在公开 DNS 里（AOP 的残余风险靠它兜着），所以不写进仓库。
#   /etc/nginx/squyrrl/relay/ca.pem           中继 CA，用来校验新加坡出示的证书
#   /etc/nginx/squyrrl/relay/client.pem/.key  中继 CA 签发的客户端证书，新加坡凭它放行
#   /etc/letsencrypt/live/api.squyrrl.cn/     certbot certonly 签出的公网证书
# =============================================================================

# OTP 发信 / 验码的按 IP 限流，对齐 server/edge/auth 的 OTP_IP_LIMIT / VERIFY_IP_LIMIT。
# 那个 Worker 挂在 api.squyrrl.com 的路由上，经本入口的请求永远到不了它；不补这一层，
# 大陆入口就成了绕开边缘限流的后门。Worker 的按邮箱桶需要解析请求体，这里不做，
# 由源站的邮箱冷却兜底。$binary_remote_addr 在本机就是客户端真实地址，不需要 realip。
limit_req_zone $binary_remote_addr zone=squyrrl_cn_otp_request:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=squyrrl_cn_otp_verify:10m  rate=20r/m;

# 升级请求得到 upgrade，普通请求是空串 —— 空串让 keepalive 照常生效。
# 写成 SG 那份 nginx.conf 里的 '' → close 会让每个普通请求都关掉到新加坡的连接。
map $http_upgrade $squyrrl_cn_connection {
    default upgrade;
    ''      '';
}

upstream squyrrl_cn_api_origin {
    include /etc/nginx/squyrrl/origin-upstream.conf;

    # 复用到新加坡的连接：新建一条要 TCP + TLS 两轮跨境往返，复用后一个请求只剩一轮。
    # 空闲连接本机 60 秒（upstream keepalive_timeout 默认值）先关，新加坡 75 秒才关，
    # 不会出现「本机刚拿出来复用、对端恰好关掉」的竞态。
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.squyrrl.cn;

    # certbot 续期用 webroot 写挑战文件到这里；路径与 16-cn-relay.md 的首签命令一致。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.squyrrl.cn;

    ssl_certificate     /etc/letsencrypt/live/api.squyrrl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.squyrrl.cn/privkey.pem;

    # 与新加坡一致；超限在这里拒掉，不占跨境带宽。
    client_max_body_size 100m;

    # ---- 到新加坡的这一跳 ----
    # 写在 server 层，各 location 只写 proxy_pass 即可继承（location 里一旦出现任何
    # proxy_set_header，就不再继承这里的全部 proxy_set_header —— 加头时写在这里）。
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $squyrrl_cn_connection;

    # Host 必须与 SNI 一致，否则新加坡 nginx 以 421 拒绝（客户端证书只在 SNI 选中的块里校验过）。
    # 新加坡那块会把 Host 改回 api.squyrrl.com 再交给 API。
    proxy_set_header      Host relay.squyrrl.internal;
    proxy_ssl_server_name on;
    proxy_ssl_name        relay.squyrrl.internal;

    # 双向认证：校验新加坡的证书（nginx 默认 proxy_ssl_verify off，被中间人替换证书也照转），
    # 同时出示本机的客户端证书。两边都只认中继 CA。
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/squyrrl/relay/ca.pem;
    proxy_ssl_certificate         /etc/nginx/squyrrl/relay/client.pem;
    proxy_ssl_certificate_key     /etc/nginx/squyrrl/relay/client.key;

    # **覆盖**而不是透传：客户端自带的 X-Real-IP 在这里被换成真实地址，
    # 新加坡那块据此信任它（信任来自证书，见 nginx.conf 的中继块）。
    proxy_set_header X-Real-IP $remote_addr;

    proxy_request_buffering off;

    # 新加坡不可达时尽快回 502，好让客户端在自己的 15 秒接收超时之前换到另一个入口；
    # 默认 60 秒会让客户端先超时，而接收超时不触发换入口。
    proxy_connect_timeout 8s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    limit_req_status 429;

    location = /health {
        access_log off;
        proxy_pass https://squyrrl_cn_api_origin;
    }

    # 新加坡也封了，这里先封：不让探测流量跨境。
    location ^~ /internal {
        return 404;
    }

    # burst = 窗口内总数 - 1，nodelay 让前几次立即放行：效果接近 Worker 的「60 秒内 N 次」固定窗口。
    location = /auth/email/request {
        limit_req zone=squyrrl_cn_otp_request burst=4 nodelay;
        proxy_pass https://squyrrl_cn_api_origin;
    }

    location = /auth/email/verify {
        limit_req zone=squyrrl_cn_otp_verify burst=19 nodelay;
        proxy_pass https://squyrrl_cn_api_origin;
    }

    location / {
        proxy_pass https://squyrrl_cn_api_origin;
    }
}
