# =============================================================================
# Squyrrl API — 宿主 nginx 反代配置（api.squyrrl.com → 127.0.0.1:10260）
#
# 本站位于 Cloudflare 橙云代理之后（ADR-074）。两条由此而来的硬约束：
#
#   1. 证书由 Cloudflare Origin CA 签发（15 年有效），浏览器不认，只在
#      CF ↔ 源站之间有效。因此**不再用 certbot**，443 块直接写在本文件里。
#      副作用是好的：旧方案里 certbot 会就地改写本文件，重新 cp 仓库版本会抹掉
#      443 块（ADR-053 记过这个坑）；现在 cp → reload 是幂等的。
#
#   2. 源站准入靠 Authenticated Origin Pulls（下方 ssl_verify_client），
#      **不靠防火墙**。本机还跑着其它服务，改 80/443 的整机放行规则会波及它们；
#      而 TLS 层的客户端证书校验作用域精确到本 server 块。
#
# 安装：
#   sudo cp nginx.conf /etc/nginx/conf.d/squyrrl-api.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置（Origin CA 证书、Origin Pull CA、真实 IP 段文件、面板开关）：
#   见 docs/readme/03-server-prod.md 第 6 节，顺序不能颠倒。
#
# 优化取向：JSON 单体（文件字节已走边缘，两个方向都不穿过本机）
#   + WebSocket 升级 + 健康检查降噪。
# =============================================================================

# WebSocket 升级映射（http 上下文，全局仅此一处定义；仅 api 需要）。
# 现阶段同步通道尚未落地，但保留升级头对普通 HTTP 无副作用，未来接入即生效。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.squyrrl.com;

    # 正常流量走不到这里：Cloudflare 侧开了 Always Use HTTPS，跳转在边缘就完成了。
    # 保留 80 块只为兜住「边缘开关被误关」；直连源站 IP 的探测会在 443 的
    # 客户端证书校验处被拒，拿不到任何东西。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.squyrrl.com;

    # ---- TLS：Cloudflare Origin CA ----
    # 对应面板的 SSL/TLS 模式必须是 **Full (strict)**。绝不能选 Flexible——
    # 那会让 CF 用明文连源站，且与上面的 80→443 跳转叠成重定向死循环。
    #
    # 不开 http2：Cloudflare 回源默认走 HTTP/1.1，源站开 h2 对访客零收益，
    # 却要引入 `listen ... http2` / `http2 on` 两种随 nginx 版本变化的写法。
    ssl_certificate     /etc/nginx/ssl/squyrrl-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/squyrrl-origin.key;

    # ---- 源站准入：Authenticated Origin Pulls ----
    # 只接受持 Cloudflare 客户端证书的 TLS 连接，直连源站 IP 的请求在握手阶段就被拒。
    # 这是「防火墙只放行 CF 网段」的替代方案：同机有其它服务，整机端口规则会误伤，
    # 而本指令的作用域就是这个 server 块。
    #
    # **顺序**：先在面板 SSL/TLS → Origin Server 打开 Authenticated Origin Pulls，
    # 再 reload nginx。反过来会让全部请求在握手期失败——fail-closed 是对的，
    # 但那是一段真实停机。
    #
    # **强度要说清楚**：区域级 AOP 用的是 Cloudflare **全体客户共用**的一张客户端证书
    # （就是下面这个 CA 签的）。它证明「连接来自 Cloudflare」，**不**证明「来自我们的账号」。
    # 挡得住的是扫全网 IP 的探测（那才是真实威胁）；挡不住「某人用自己的 Cloudflare 账号
    # 建区、把源站 IP 填成我们的」这类定向攻击。要堵这一档得用 per-hostname AOP 上传自签的
    # 客户端证书（目前需走 API），或干脆改 Cloudflare Tunnel 让源站没有入站端口。
    # 现阶段接受该残余风险：源站 IP 已不在公开 DNS 里，且这层之上还有 Access / 限流。
    ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # ---- 真实客户端 IP ----
    # 放在 server 块内而**不是** http 上下文：http 层会改写同机所有服务的
    # $remote_addr，那是别人的服务，不该被我们的配置牵动。
    #
    # 文件由 03-server-prod.md 的脚本生成（Cloudflare 网段会变，属主机状态、不入库，
    # 与 .env.prod 同一类）。用精确路径而非 glob：文件缺失时 nginx 直接启动失败。
    # 若静默跳过，$remote_addr 会悄悄变成 CF 边缘 IP，按 IP 分桶的限流会把全世界
    # 塞进同一个桶——第一个人打满，其余全员 429，且不报任何错。
    include /etc/nginx/squyrrl/cloudflare-realip.conf;

    # Cloudflare 免费 / Pro 计划的请求体上限是 100 MB（跟**账户**计划走，
    # 不随 Workers 计划变——ADR-069 已踩过这个知识点）。文件字节现在走边缘，
    # 本机最大的请求体是匿名 claim 的 JSON。与 CF 对齐写 100m：超限请求在边缘就被拒，
    # 这里的值只对「握手通过的直连」生效，是第二道而非第一道。
    client_max_body_size 100m;

    # 只压缩 JSON/文本响应；上传体本就多为二进制，交给后端。
    # 边缘也会压一次，这里压的是 CF ↔ 源站这一段。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    # 健康检查每几秒一次，写进 access_log 只会淹没真实请求；单独降噪。
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:10260;
        proxy_set_header Host $host;
    }

    # 内部端（/internal/tg/*、/internal/admin/*）一律不从公网放行。
    # 合法调用方 tgbot 与 admin 都在同一 docker 网络里直连 http://api:8080，
    # 根本不经过本反代，因此这条封禁对功能零影响，只是把 X-Internal-Token
    # 从「唯一防线」降级为「第二道防线」——发币、改第三方 endpoint 密钥这类
    # 高危操作不该只靠一次字符串比对挡在公网前。
    #
    # 用 ^~ 前缀而非 location /internal/：`^~` 阻断后续正则 location 参与匹配，
    # 且不带尾斜杠可一并覆盖 /internal 与 /internal../ 之类的探测路径。
    # 返回 404 而非 deny all（403）：403 等于向扫描器确认「这里确实有东西」，
    # 404 让内部端在公网视角下与不存在的路径无法区分。
    location ^~ /internal {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:10260;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（预留：同步推送 / 设备超限踢出）。
        # Cloudflare 各计划都支持 WS，且 100 秒源站超时不作用于已建立的连接。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关掉请求体缓冲：大包直接边收边转给后端，
        # 否则 nginx 会先把整包落到 proxy_temp 磁盘再转发，白白翻倍 IO 与延迟。
        # 代价是后端需自行处理慢速客户端（Go 的超时中间件已覆盖）。
        proxy_request_buffering off;

        # 注意：这两个 300s 现在**不是**有效上限。Cloudflare 免费版要求源站在
        # 100 秒内开始响应，否则边缘直接回 524，nginx 这边还在等也没用。
        # 真正的长事务（满额 claim）要么压到 100s 内，要么分批。
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
