# =============================================================================
# Squyrrl API — 宿主 nginx 反代配置（api.squyrrl.app → 127.0.0.1:8080）
#
# 只声明 80 端口：443 / SSL 由 certbot --nginx 自动注入（listen 443 ssl、
# ssl_certificate 路径、80→443 跳转都由 certbot 改写本文件，无需手写）。
#
# 安装：
#   sudo cp server/api/squyrrl/nginx.conf /etc/nginx/conf.d/squyrrl-api.conf
#   sudo certbot --nginx -d api.squyrrl.app   # 首次签发；之后 certbot.timer 自动续期
#   sudo nginx -t && sudo systemctl reload nginx
#
# 优化取向：JSON 单体 + 大文件直传（服务端上限 100 MiB），故重点在
#   上传流式透传 + WebSocket 升级 + 健康检查降噪。
# =============================================================================

# WebSocket 升级映射（http 上下文，全局仅此一处定义；仅 api 需要）。
# 现阶段同步通道尚未落地，但保留升级头对普通 HTTP 无副作用，未来接入即生效。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.squyrrl.app;

    # 与服务端 100 MiB 上限对齐并留余量；超限直接由 nginx 413 拦截，不进后端。
    client_max_body_size 120m;

    # 只压缩 JSON/文本响应；上传体本就多为二进制，交给后端。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    # 健康检查每几秒一次，写进 access_log 只会淹没真实请求；单独降噪。
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（预留：同步推送 / 设备超限踢出）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关掉请求体缓冲：120 MiB 上传直接边收边转给后端，
        # 否则 nginx 会先把整包落到 proxy_temp 磁盘再转发，白白翻倍 IO 与延迟。
        # 代价是后端需自行处理慢速客户端（Go 的超时中间件已覆盖）。
        proxy_request_buffering off;

        # 上传/长请求给足时间；响应仍走默认缓冲（对慢客户端更友好）。
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
