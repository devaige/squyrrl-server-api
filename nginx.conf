# =============================================================================
# Squyrrl API — 宿主 nginx 反代配置（api.squyrrl.com → 127.0.0.1:10260）
#
# 只声明 80 端口：443 / SSL 由 certbot --nginx 自动注入（listen 443 ssl、
# ssl_certificate 路径、80→443 跳转都由 certbot 改写本文件，无需手写）。
#
# 安装：
#   sudo cp nginx.conf /etc/nginx/conf.d/squyrrl-api.conf
#   sudo certbot --nginx -d api.squyrrl.com   # 首次签发；之后 certbot.timer 自动续期
#   sudo nginx -t && sudo systemctl reload nginx
#
# 优化取向：JSON 单体 + 大文件直传（服务端上限 100 MiB），故重点在
#   上传流式透传 + WebSocket 升级 + 健康检查降噪。
# =============================================================================

# WebSocket 升级映射（http 上下文，全局仅此一处定义；仅 api 需要）。
# 现阶段同步通道尚未落地，但保留升级头对普通 HTTP 无副作用，未来接入即生效。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.squyrrl.com;

    # 与服务端 100 MiB 上限对齐并留余量；超限直接由 nginx 413 拦截，不进后端。
    client_max_body_size 120m;

    # 只压缩 JSON/文本响应；上传体本就多为二进制，交给后端。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    # 健康检查每几秒一次，写进 access_log 只会淹没真实请求；单独降噪。
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:10260;
        proxy_set_header Host $host;
    }

    # 内部端（/internal/tg/*、/internal/admin/*）一律不从公网放行。
    # 合法调用方 tgbot 与 admin 都在同一 docker 网络里直连 http://api:8080，
    # 根本不经过本反代，因此这条封禁对功能零影响，只是把 X-Internal-Token
    # 从「唯一防线」降级为「第二道防线」——发币、改第三方 endpoint 密钥这类
    # 高危操作不该只靠一次字符串比对挡在公网前。
    #
    # 用 ^~ 前缀而非 location /internal/：`^~` 阻断后续正则 location 参与匹配，
    # 且不带尾斜杠可一并覆盖 /internal 与 /internal../ 之类的探测路径。
    # 返回 404 而非 deny all（403）：403 等于向扫描器确认「这里确实有东西」，
    # 404 让内部端在公网视角下与不存在的路径无法区分。
    location ^~ /internal {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:10260;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（预留：同步推送 / 设备超限踢出）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关掉请求体缓冲：120 MiB 上传直接边收边转给后端，
        # 否则 nginx 会先把整包落到 proxy_temp 磁盘再转发，白白翻倍 IO 与延迟。
        # 代价是后端需自行处理慢速客户端（Go 的超时中间件已覆盖）。
        proxy_request_buffering off;

        # 上传/长请求给足时间；响应仍走默认缓冲（对慢客户端更友好）。
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
