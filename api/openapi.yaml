openapi: 3.1.0
info:
  title: Squyrrl API
  version: 0.1.0
  description: |
    Squyrrl（箩筐）主 API 契约。本文件描述 Phase 1 已实现的 20 个端点。

    ## 认证模型

    - 客户端用邮箱 OTP 登录得到 `access_token`（1h）+ `refresh_token`（30d）。
    - 受保护端点要求 `Authorization: Bearer <access_token>` 请求头。
    - access token 过期后用 `/auth/refresh` 旋转出新的 access；refresh token 不旋转。
    - 任何 token 都仅以 SHA-256 哈希入库；明文 token 永不持久化。

    ## 同步并发控制

    - `snippets.version` 是单调自增的乐观锁。
    - 写入端点（PATCH / DELETE）必须携带 `If-Match: "<version>"` 头，否则 400 / 409。
    - 读取端点会返回 `ETag: "<version>"` 响应头。
    - 增量同步：`GET /snippets?since=<RFC3339>` 返回 `updated_at >= since` 的碎片，按时间升序，附带 `next_since` 用于下一次请求。
    - `?include_deleted=true` 让同步流包含软删除的碎片（带 `deleted_at`），客户端据此本地下架。

    ## 数据混淆

    - `snippets.text_content` 与未来的文件 blob 在客户端用 XChaCha20-Poly1305 + 应用静态密钥混淆后再上传。
    - 服务器只见混淆字节，不解密。在 JSON 中字段以 base64 出现（Go `[]byte` 默认编码）。
  contact:
    name: Squyrrl
    url: https://squyrrl.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:10260
    description: 开发环境（本机 Docker Compose）
  - url: https://api.squyrrl.com
    description: 生产环境（占位）

tags:
  - name: System
    description: 健康检查与平台信息
  - name: Auth
    description: 认证、会话、当前用户
  - name: Pages
    description: 用户的页面（碎片组织单元，1:N）
  - name: Tags
    description: 用户的标签（碎片组织单元，N:N）
  - name: Snippets
    description: 碎片 — 产品的核心实体
  - name: Files
    description: 文件存储（混淆字节）+ 跨用户去重
  - name: URIs
    description: URI 解析为特殊碎片（Phase 1.5：YouTube）
  - name: Telegram
    description: Telegram Bot 绑定与转发（用户端 + 内部端）
  - name: Passkey
    description: WebAuthn / Passkey 注册与无密码登录
  - name: QR
    description: 扫码绑定新设备
  - name: Wallet
    description: 用户订阅 plan + 代币余额（只读视图 + 内部充值端点）

# 全局默认要求 Bearer。公开端点用 security: [] 显式覆盖
security:
  - bearerAuth: []

# =============================================================================
# 端点
# =============================================================================
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: 健康检查
      description: 返回服务运行状态及数据库联通性。
      security: []
      responses:
        '200':
          description: 一切正常
          content:
            application/json:
              schema:
                type: object
                required: [status, env]
                properties:
                  status: { type: string, enum: [ok] }
                  env: { type: string, examples: [dev, test, prod] }
        '503':
          description: 数据库不通
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [down] }
                  db: { type: string }

  # ---------------------------------------------------------------- Auth
  /auth/email/request:
    post:
      operationId: requestEmailOtp
      tags: [Auth]
      summary: 请求邮箱登录验证码
      description: |
        生成 6 位数字 OTP，10 分钟有效，通过 SMTP 邮件投递。
        无论邮箱是否存在均返回 204，避免邮箱枚举。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: 已（尝试）发送 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/email/verify:
    post:
      operationId: verifyEmailOtp
      tags: [Auth]
      summary: 用 OTP 验证并签发会话
      description: 校验 OTP 成功后注册或登录用户，注册或更新设备，签发 access + refresh token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, device]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$' }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: 旋转 access token
      description: 用 refresh_token 换发新的 access_token。refresh_token 本身不旋转。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 新 token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 登出当前会话
      description: 撤销当前 access token 对应的会话；客户端应清空本地 token。
      responses:
        '204': { description: 已撤销 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: 当前用户信息
      responses:
        '200':
          description: 当前 user + device 视角
          content:
            application/json:
              schema:
                type: object
                required: [user, device_id]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  device_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Pages
  /pages:
    post:
      operationId: createPage
      tags: [Pages]
      summary: 创建页面
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageCreateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listPages
      tags: [Pages]
      summary: 列出当前用户的页面
      description: 按 `order_idx` 升序、`created_at` 升序返回；不含软删除条目。
      responses:
        '200':
          description: 页面列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Page' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pages/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: getPage
      tags: [Pages]
      summary: 拉取单个页面
      responses:
        '200':
          description: 页面
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePage
      tags: [Pages]
      summary: 更新页面
      description: "系统页面（`is_system: true`）禁止改名 / 改隐藏，但可调 `order_idx`。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageUpdateInput' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 系统页面只读
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePage
      tags: [Pages]
      summary: 软删除页面
      description: |
        软删除该页面，并把该用户下指向它的所有未删除碎片的 `page_id` 置为 NULL，
        同时把这些碎片的 `version` 加 1（保证客户端通过同步流能看到变更）。
        系统页面禁止删除。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 系统页面只读
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Tags
  /tags:
    post:
      operationId: createTag
      tags: [Tags]
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagCreateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 标签名重复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listTags
      tags: [Tags]
      summary: 列出标签
      description: 按 `name` 升序返回。
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      operationId: updateTag
      tags: [Tags]
      summary: 重命名标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同名标签已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: 删除标签
      description: 物理删除；通过外键级联自动清理 `snippet_tags` 关联。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Snippets
  /snippets:
    post:
      operationId: createSnippet
      tags: [Snippets]
      summary: 创建碎片
      description: |
        客户端可通过 `id` 字段携带本地生成的 UUID（用于离线写）。
        `tag_ids` 与 `page_id` 必须归属当前用户，否则返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetCreateInput' }
      responses:
        '201':
          description: 已创建
          headers:
            ETag:
              description: 当前 version，包在双引号里，可用作后续 If-Match
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listSnippets
      tags: [Snippets]
      summary: 列出 / 同步碎片
      description: |
        - 不传 `since`：浏览模式，按 `updated_at` 倒序，最多 `limit`（默认 100，上限 200）。
        - 传 `since`：同步模式，按 `updated_at` 升序，返回 `updated_at >= since` 的条目，附 `next_since` 供下次请求。
        - `include_deleted=true` 让结果包含软删除条目（`deleted_at` 非空）。
      parameters:
        - in: query
          name: page_id
          schema: { type: string, format: uuid }
        - in: query
          name: tag_id
          schema: { type: string, format: uuid }
        - in: query
          name: since
          description: RFC3339 时间戳；触发同步模式
          schema: { type: string, format: date-time }
        - in: query
          name: include_deleted
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: q
          description: |
            全文搜索关键字。Phase 1.5 仅对 `title` / `description` 做 ILIKE 单词包含匹配（大小写不敏感）。
            `text_content` 因后续将启用客户端混淆，不在服务端索引；客户端启用混淆后需要全文搜索时切换到本地索引方案。
          schema: { type: string }
      responses:
        '200':
          description: 碎片列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnippetList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /snippets/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: getSnippet
      tags: [Snippets]
      summary: 拉取单个碎片
      responses:
        '200':
          description: 碎片
          headers:
            ETag:
              description: 当前 version，可作为后续 If-Match
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSnippet
      tags: [Snippets]
      summary: 更新碎片（乐观锁）
      description: |
        必须携带版本号，渠道有二选一：
        - HTTP 头 `If-Match: "<version>"`（推荐）
        - body 中的 `version` 字段（兜底）

        字段存在即更新；缺省字段保持不变。`tag_ids` 为空数组表示清空所有标签。
        type / source / 等不可变字段无法通过 PATCH 修改。
      parameters:
        - in: header
          name: If-Match
          schema: { type: string }
          description: 双引号包裹的版本号，例如 `"3"`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetUpdateInput' }
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              description: 自增后的 version
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            版本不匹配（乐观锁失败）。
            服务端会自动把客户端提交的内容作为「loser 副本」入用户的「冲突收件箱」系统页面（按需建立），
            响应里包含 `loser_snippet_id` 和 `loser_page_id` 便于客户端跳转展示。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnippetConflictResponse' }
    delete:
      operationId: deleteSnippet
      tags: [Snippets]
      summary: 软删除碎片
      description: |
        必须携带 `If-Match` 头。删除会设置 `deleted_at = now()` 并把 `version + 1`，
        以便客户端能通过同步流（include_deleted=true）感知到此次删除。
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: 双引号包裹的版本号
      responses:
        '204': { description: 已删除 }
        '400':
          description: 缺少 If-Match 头
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本不匹配
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Files
  /files/check:
    post:
      operationId: checkFile
      tags: [Files]
      summary: 按 plain_hash 查重
      description: |
        客户端先把文件明文 SHA-256 提交，命中则直接拿到 file_id 复用，
        未命中再走 `POST /files/intent` 直传。节流量并实现跨用户去重（ADR-004）。
        去重前置于混淆：命中就连加密都省了（混淆用随机 nonce，密文每次不同，
        所以去重键只能是明文哈希）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileCheckInput' }
      responses:
        '200':
          description: 查重结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /files/intent:
    post:
      operationId: createUploadIntent
      tags: [Files]
      summary: 申请直传令牌（ADR-069）
      description: |
        直传三步的第一步。服务端查重，未命中则开 R2 multipart（`size_bytes > part_size` 时）、
        落一行 `upload_intents`、签发 HMAC 令牌。

        令牌里**签死了对象 key**，边缘 Worker 只认令牌里的值、不读 URL 路径 ——
        对象 key 是内容寻址的（`hex(cipher_hash)`），客户端若能自选 key 就能覆盖别人的文件。

        `exists=true` 时其余字段全部缺省：命中全局去重，一个字节都不用传。

        `upload_url` 恒为非空：生产指向 Worker 自定义域，dev 指向 api 自带的 `/edge`
        内嵌边缘（Worker 的 R2 binding 连不到 MinIO）。两者契约一致，客户端只需换终点。

        `SQUYRRL_UPLOAD_EDGE_BASE` / `SQUYRRL_UPLOAD_TOKEN_SECRET` 任一为空 ⇒ **503**
        （fail-closed）。**没有服务端中转回退**：漏配的代价是传不了文件，而不是让文件字节
        穿过 api 产生出网带宽费用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadIntentInput' }
      responses:
        '200':
          description: 已命中去重，或已签发令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 单文件超过 100MiB
        '503':
          description: 未配置上传令牌密钥，直传不可用

  /files/commit:
    post:
      operationId: commitUpload
      tags: [Files]
      summary: 收尾直传（ADR-069）
      description: |
        直传三步的第三步。合并分片（multipart 模式）、用 `StatObject` 核对 R2 中的
        **实际**字节数与申请时声明的是否一致（直传之后这是唯一能确认「真的传了这么多」
        的地方），一致才写 `files` 行。

        单片模式 `parts` 留空；multipart 模式必须交齐每片的 ETag，序号需覆盖
        `1..part_count` 且无缺号、无重号。

        本路径**不生成缩略图**：api 手里没有字节，拉回来会抵消掉直传省下的带宽；
        且混淆后的字节本就解不出图（见 ADR-050），故无行为损失。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCommitInput' }
      responses:
        '200':
          description: 已落库
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 上传意图不存在或不属于当前用户
        '409':
          description: 该上传意图已收尾或已作废

  /edge/v1/single:
    put:
      operationId: edgeUploadSingle
      tags: [Files]
      summary: 内嵌边缘 — 单片写入（仅 dev）
      description: |
        与 `server/edge/upload` 的 Cloudflare Worker **契约完全一致**的一份 Go 实现，
        挂在 api 自身。**仅在 `SQUYRRL_ENV != prod` 时注册**，生产环境本端点不存在 ——
        门闩按环境而非「是否配了 Worker」开，否则漏配一个环境变量就等于悄悄留下一条
        绕开 CDN、改吃服务器出网带宽的上传路径。

        存在的理由是 dev：本地接 MinIO，而 Worker 的 R2 binding 连不到 MinIO
        （`wrangler dev` 的本地 R2 是另一套存储，commit 时 `StatObject` 必然找不到对象）。

        认证用 `POST /files/intent` 签发的**上传令牌**，不是 Bearer access token。
        请求体为该对象的全部混淆字节；服务端校验大小与整体 `cipher_hash` 后才写入。

        上传令牌与下载令牌共用同一把密钥但用途不同，签名互不通用（见 `/edge/v1/blob`）。
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
          description: '`Bearer <upload_token>`'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 已写入
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 令牌缺失、签名不符或已过期

  /edge/v1/part/{n}:
    put:
      operationId: edgeUploadPart
      tags: [Files]
      summary: 内嵌边缘 — 分片写入（仅 dev）
      description: |
        见 `/edge/v1/single`。`n` 为 1-based 分片序号，须落在 `1..part_count`。
        末片大小是余数，其余恒为 `part_size`；大小不符直接拒绝，不必等到 commit
        才拿一个 R2 的通用错误。

        multipart 下整体哈希跨请求算不出来，故改为逐片校验可选的 `X-Part-Hash`。
        两者都只挡传输损坏 —— `plain_hash` 与 `cipher_hash` 皆由客户端声称，
        而服务端没有混淆密钥（ADR-003），从来就无法验证二者对应。
      security: []
      parameters:
        - in: path
          name: n
          required: true
          schema: { type: integer, minimum: 1 }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
          description: '`Bearer <upload_token>`'
        - in: header
          name: X-Part-Hash
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: 该片密文的 SHA-256；提供则逐片校验
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 分片已写入，返回 ETag 供 commit 使用
          content:
            application/json:
              schema:
                type: object
                required: [part_number, etag]
                properties:
                  part_number: { type: integer }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 令牌缺失、签名不符或已过期

  /edge/v1/blob:
    get:
      operationId: edgeGetBlob
      tags: [Files]
      summary: 内嵌边缘 — 凭票读对象（仅 dev）
      description: |
        见 `/edge/v1/single` 的门闩说明，同样**仅在 `SQUYRRL_ENV != prod` 时注册**。
        生产由 `server/edge/upload` 的 Worker 在自定义域上承担同一条路由。

        认证用 `GET /files/{id}/ticket` 签发的**下载令牌**，不是 Bearer access token。
        令牌两种取法都认：`?t=` 查询参数或 `Authorization: Bearer`。

        **下载令牌与上传令牌签名互不通用**：用途字符串参与 HMAC 计算。否则一张下载票
        （没有 `sz`/`ch`）就能拿去打 `/edge/v1/single`，边缘会解出「期望 0 字节、
        无需校验哈希」，把那个内容寻址的 key 覆盖成空对象。

        `Content-Type` 取自令牌而非 R2 元数据：直传是用 binding 的 `put(key, body)` 写的、
        没带 httpMetadata，从 R2 读只会得到 `application/octet-stream`。
      security: []
      parameters:
        - in: query
          name: t
          schema: { type: string }
          description: '下载令牌；也可改用 `Authorization: Bearer <token>` 头'
        - in: header
          name: If-None-Match
          schema: { type: string }
          description: 命中则回 304，不传字节
      responses:
        '200':
          description: 对象字节
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
              description: '`private, max-age=31536000, immutable`（key 是内容寻址的，字节永不改变）'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304':
          description: 与 If-None-Match 一致，未变更
        '401':
          description: 令牌缺失、签名不符、用途不对或已过期
        '404':
          description: 对象不存在

  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: getFileMetadata
      tags: [Files]
      summary: 获取文件元数据
      description: |
        仅返回 file 元数据 JSON（id / plain_hash / cipher_hash / size / mime），不传字节。
        只需要 mime / size 时用这个；要真取字节请用 `/files/{id}/ticket`，
        它在同一次往返里把元数据和边缘直读 URL 一起给你。
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{id}/ticket:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: issueFileTicket
      tags: [Files]
      summary: 签发下载票（边缘直读 URL）
      description: |
        返回文件元数据 + 一组**短期**边缘直读 URL（ADR-070）。api 在这里只查库和签名，
        不接触任何字节：字节走 `R2 → Worker → 客户端`，全程在 Cloudflare 内部。

        取代了此前 `GET /files/{id}/download` 与 `GET /files/{id}/thumb` 两个
        `io.Copy` 字节的端点 —— 那两个端点每次读都要把整个对象从 R2 拉进 api 再推给
        客户端，同一份流量付两次钱，而读的次数天然远多于写。

        `thumb_url` 缺省即「没有缩略图」，客户端据此 fallback 到 `blob_url` 拉原始混淆
        字节自行解混淆；不必再打一次 `/thumb` 去吃 404。

        令牌签在 URL 的 `t` 查询参数里，为的是 URL 自包含、能直接喂给 `<img src>`。
        代价是令牌会进访问日志，由很短的 TTL（10 分钟）兜住。

        未配置边缘时返回 503：**没有**回退到服务端中转的档位。
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: 本服务未启用边缘（`SQUYRRL_UPLOAD_EDGE_BASE` / `SQUYRRL_UPLOAD_TOKEN_SECRET` 缺失）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- URIs
  /uris/parse:
    post:
      operationId: parseUri
      tags: [URIs]
      summary: 解析 URI 为结构化碎片
      description: |
        服务端按已注册的 provider 顺序匹配 URI（Phase 1.5：YouTube oEmbed），
        命中后调上游 API 解析并写入跨用户共享缓存（ADR-005）。
        响应中的 `snippet` 字段可直接 POST 给 `/snippets` 创建特殊碎片。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uri]
              properties:
                uri: { type: string, format: uri }
      responses:
        '200':
          description: 解析成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: |
            credits 余额不足。cache 命中不收费；cache miss 时按 `SQUYRRL_PARSE_COST` 扣减（dev 默认 0 即不强制，生产推荐 2）。
            客户端应引导用户充值后重试，或读取 `/me/wallet` 查询当前余额。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 没有可用的 parser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 上游 provider 错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Telegram Binding
  # 绑定载体是 Telegram deep link（2026-09-06）：App 为已登录用户签发一枚令牌，
  # 拼成 t.me/<bot>?start=<token> 渲染成二维码 / 可点链接；用户点开后 Bot 收到
  # /start <token> 并调内部端核销。用户不搬运任何字符串，令牌也不以人眼可读的
  # 形式出现，因而不会被顺手粘进群聊。
  /me/tg/bindings:
    get:
      operationId: listTelegramBindings
      tags: [Telegram]
      summary: 列出当前用户已绑定的 Telegram 账号
      description: 一个 Squyrrl 账户可以绑定多个 Telegram 账号。
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    items: { $ref: '#/components/schemas/TelegramBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/tg/binding/link:
    post:
      operationId: issueTelegramBindingLink
      tags: [Telegram]
      summary: 签发绑定 deep link
      description: |
        为当前用户签发一枚一次性令牌并拼成 `t.me/<bot>?start=<token>`。
        TTL 内重复调用返回同一枚令牌，避免用户正在扫码时二维码变化。
        令牌是 base64url(32B)，43 字符，落在 deep link payload 的 64 字符
        与 `[A-Za-z0-9_-]` 限制内。
      responses:
        '200':
          description: 绑定链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramBindingLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: 服务端未配置 `SQUYRRL_TG_BOT_USERNAME`，功能暂未开放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/tg/bindings/{id}:
    delete:
      operationId: deleteTelegramBinding
      tags: [Telegram]
      summary: 解除一个 Telegram 绑定
      description: 已保存的碎片保留；对应的 telegram 设备占位被标记撤销。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已解绑 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 绑定不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/binding/consume:
    post:
      operationId: consumeTelegramBindingToken
      tags: [Telegram]
      summary: Bot 端：核销 deep link 令牌完成绑定
      description: |
        仅 Squyrrl Telegram Bot 调用，受 `X-Internal-Token` 头保护。
        Bot 收到 `/start <token>` 后提交令牌与它观察到的 TG 身份；
        核销是原子的，同一令牌重复提交只有第一次成功。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, tg_user_id]
              properties:
                token: { type: string }
                tg_user_id: { type: integer, format: int64 }
                tg_username: { type: string }
                tg_name: { type: string }
      responses:
        '200':
          description: 已绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramBinding' }
        '400':
          description: 令牌无效或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 该 tg_user_id 已绑定其它 Squyrrl 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/binding/status:
    get:
      operationId: getTelegramBindingStatus
      tags: [Telegram]
      summary: Bot 端：查询某个 tg_user_id 的绑定状态
      description: |
        Bot 在把消息正文发过来之前先问一次，未绑定用户的内容因此不必经过
        创建碎片的请求体与日志。
      security:
        - internalToken: []
      parameters:
        - name: tg_user_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 绑定状态
          content:
            application/json:
              schema:
                type: object
                required: [bound]
                properties:
                  bound: { type: boolean }
                  tg_username: { type: string }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/binding/revoke:
    post:
      operationId: revokeTelegramBinding
      tags: [Telegram]
      summary: Bot 端：解除绑定（/unbind 命令）
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tg_user_id]
              properties:
                tg_user_id: { type: integer, format: int64 }
      responses:
        '204': { description: 已解绑 }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 该 tg_user_id 未绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/snippet:
    post:
      operationId: forwardTelegramSnippet
      tags: [Telegram]
      summary: Bot 端：以已绑定用户身份创建碎片
      description: |
        仅 Squyrrl Telegram Bot 调用，受 `X-Internal-Token` 头保护。
        服务端按 tg_user_id 找到对应 user_id 后创建。
        `text_content` 由 Bot 侧完成混淆（ADR-003/042），服务端不解读其字节。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tg_user_id, snippet]
              properties:
                tg_user_id: { type: integer, format: int64 }
                snippet:
                  type: object
                  properties:
                    type:
                      type: string
                      default: normal
                      enum: [uri, url, normal, special]
                    subtype:
                      type: string
                      description: special 类型的子类，如 telegram_contact / telegram_profile
                    title: { type: string }
                    description: { type: string }
                    text_content:
                      type: string
                      format: byte
                      description: 已混淆的字节（nonce|ciphertext|mac）
                    text_format: { type: string, default: plain }
                    payload:
                      type: object
                      description: TG 富元数据，含 forward_origin / contact / profile
                    file_ids:
                      type: array
                      items: { type: string, format: uuid }
                      description: 经 /internal/tg/files 上传后拿到的附件，按序挂成 elements
                    chat_id: { type: integer, format: int64 }
                    message_id: { type: integer, format: int64 }
      responses:
        '201':
          description: 碎片已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: tg_user_id 未绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/files/check:
    post:
      operationId: checkTelegramFile
      tags: [Telegram]
      summary: Bot 端：按明文哈希查全局去重表
      description: |
        与用户端 `/files/check` 语义相同，只是换一道守卫 —— `/files` 那组挂着
        Bearer 中间件，而 Bot 只有内部 token，没有用户身份。files 表本身是全局的
        （ADR-004），与 user 无关，因此复用同一个 service，没有第二套存储逻辑。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plain_hash]
              properties:
                plain_hash: { type: string, description: hex(sha256) }
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                type: object
                required: [exists]
                properties:
                  exists: { type: boolean }
                  file: { $ref: '#/components/schemas/File' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/files:
    post:
      operationId: uploadTelegramFile
      tags: [Telegram]
      summary: Bot 端：上传已混淆的附件字节
      security:
        - internalToken: []
      parameters:
        - { name: X-Plain-Hash,  in: header, required: true, schema: { type: string } }
        - { name: X-Cipher-Hash, in: header, required: true, schema: { type: string } }
        - { name: X-Size-Bytes,  in: header, required: true, schema: { type: integer } }
        - { name: X-Mime,        in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 已入库
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '400':
          description: 头缺失，或收到的字节与声明的哈希/大小不符
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: 超过单文件 100MiB 上限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Wallet
  /me/wallet:
    get:
      operationId: getWallet
      tags: [Wallet]
      summary: 当前用户的订阅 plan + 代币余额
      description: |
        Phase 1.5 只读视图：
        - `plan` = 用户当前 active 的会员订阅 tier；无活跃订阅时返 `"free"`。
        - `credits_balance` = `SUM(delta)` over `credits_ledger`，永远以此为准。
      responses:
        '200':
          description: 钱包视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/admin/credits/grant:
    post:
      operationId: grantCredits
      tags: [Wallet]
      summary: 内部：给指定用户调整 credits 余额
      description: |
        受 X-Internal-Token 头保护。供管理后台 / 支付回调 / 运营批处理调用。
        `delta` 可正可负；服务端用 advisory lock 串行化同一用户的并发写入，
        保证 `credits_ledger.balance_after` 列单调连续。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, delta, reason]
              properties:
                user_id: { type: string, format: uuid }
                delta:
                  type: integer
                  format: int64
                  description: 正数入账，负数罚扣 / 退款冲销
                reason:
                  type: string
                  description: 流水原因，例如 'purchase' / 'admin_grant' / 'parse_uri' / 'refund'
      responses:
        '200':
          description: 流水记录已生成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditsGrantResponse' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Passkey (WebAuthn)
  /auth/passkey/register/begin:
    post:
      operationId: passkeyRegisterBegin
      tags: [Passkey]
      summary: 已登录用户：发起 passkey 注册
      description: |
        返回 PublicKeyCredentialCreationOptions（W3C Web Authentication）+ session_id。
        客户端应调用 `navigator.credentials.create({ publicKey })`，
        把生成的 `PublicKeyCredential` 序列化后通过 `register/finish` 回传。
      responses:
        '200':
          description: 注册 ceremony 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyRegisterBeginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/passkey/register/finish:
    post:
      operationId: passkeyRegisterFinish
      tags: [Passkey]
      summary: 已登录用户：提交 passkey 凭据完成注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, response]
              properties:
                session_id: { type: string }
                response:
                  type: object
                  description: 客户端 PublicKeyCredential 的 JSON 序列化
                  additionalProperties: true
                name:
                  type: string
                  description: 用户给该凭据起的名字（"MacBook 内置 TouchID" 等）
      responses:
        '204': { description: 已绑定 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/passkey/login/begin:
    post:
      operationId: passkeyLoginBegin
      tags: [Passkey]
      summary: 公开：发起 passkey 登录（无密码）
      description: |
        服务端按 email 定位用户并发出 challenge。
        返回 PublicKeyCredentialRequestOptions + session_id；
        客户端调 `navigator.credentials.get({ publicKey })` 后回传到 `login/finish`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 登录 ceremony 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyLoginBeginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 用户未注册过 passkey 或邮箱不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/passkey/login/finish:
    post:
      operationId: passkeyLoginFinish
      tags: [Passkey]
      summary: 公开：提交 passkey assertion，签发会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, email, response, device]
              properties:
                session_id: { type: string }
                email: { type: string, format: email }
                response:
                  type: object
                  additionalProperties: true
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- QR 扫码绑定
  /auth/qr/start:
    post:
      operationId: qrStart
      tags: [QR]
      summary: 已登录设备：拿一个 90 秒有效的绑定码
      description: |
        客户端可把返回的 `code` 编码为二维码展示给新设备扫描，
        或直接让用户在新设备手动输入绑定码（推荐 8 字符不易混淆字符集）。
      responses:
        '200':
          description: 绑定码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QRCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/qr/redeem:
    post:
      operationId: qrRedeem
      tags: [QR]
      summary: 新设备：兑换绑定码 + 设备元数据 → 登录
      description: |
        与 `/auth/email/verify` / `/auth/passkey/login/finish` 共享 LoginResult 响应；
        签发到的 access/refresh token 与其它登录方式无差异。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device]
              properties:
                code:
                  type: string
                  minLength: 8
                  maxLength: 8
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 绑定码无效或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# =============================================================================
# 复用组件
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 仅供 Bot 等内部服务调用；与主 API 共享同一个秘密

  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证 / token 无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在或不归属当前用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- 通用 ----------
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 人可读的错误描述（中文） }

    # ---------- 认证 ----------
    User:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, 'null']
          format: email
        handle:
          type: [string, 'null']
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Device:
      type: object
      required: [id, user_id, name, platform, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        last_seen_at: { type: string, format: date-time }

    Platform:
      type: string
      enum: [ios, android, macos, windows, linux, web, browser, telegram, wechat]

    DeviceInput:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: '#/components/schemas/Platform' }

    TokenPair:
      type: object
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }

    LoginResult:
      type: object
      required: [user, device, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    # ---------- 页面 ----------
    Page:
      type: object
      required: [id, name, is_hidden, is_system, order_idx, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_hidden: { type: boolean }
        is_system: { type: boolean }
        order_idx: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PageCreateInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端可选指定 UUID（离线生成）
        name: { type: string, minLength: 1, maxLength: 100 }
        is_hidden: { type: boolean, default: false }
        order_idx: { type: integer, default: 0 }

    PageUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        is_hidden: { type: boolean }
        order_idx: { type: integer }

    # ---------- 标签 ----------
    Tag:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TagCreateInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端可选指定 UUID
        name: { type: string, minLength: 1, maxLength: 50 }

    # ---------- 碎片 ----------
    SnippetType:
      type: string
      enum: [uri, url, normal, special]

    SnippetTextFormat:
      type: string
      enum: [plain, markdown, code]

    SnippetSourceType:
      type: string
      enum: [device, upstream]

    Snippet:
      type: object
      required:
        - id
        - type
        - text_format
        - payload
        - source_type
        - source_data
        - version
        - tag_ids
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        page_id:
          type: [string, 'null']
          format: uuid
        type: { $ref: '#/components/schemas/SnippetType' }
        subtype:
          type: [string, 'null']
          description: type=special 时的具体子类，例如 tweet / apk / gist / youtube
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        text_content:
          type: string
          format: byte
          description: 客户端混淆后的字节，base64 编码。服务器不解密
        text_format: { $ref: '#/components/schemas/SnippetTextFormat' }
        text_lang:
          type: [string, 'null']
          description: 仅 text_format=code 时有意义
        payload:
          type: object
          additionalProperties: true
          description: "类型相关字段，例如 url 碎片的 `{url: ...}` 或推文解析数据"
        source_type: { $ref: '#/components/schemas/SnippetSourceType' }
        source_data:
          type: object
          additionalProperties: true
          description: |
            device 时形如 `{device_id, name, platform}`；
            upstream 时形如 `{provider, author_handle, author_avatar_url, ...}`
        version:
          type: integer
          format: int64
          description: 单调自增；写入时作乐观锁
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        elements:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: [string, 'null']
          format: date-time

    Element:
      type: object
      required: [id, file_id, order_idx, created_at]
      properties:
        id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        order_idx: { type: integer }
        alt_text:
          type: [string, 'null']
        created_at: { type: string, format: date-time }

    ElementInput:
      type: object
      required: [file_id]
      properties:
        file_id: { type: string, format: uuid }
        order_idx: { type: integer, default: 0 }
        alt_text: { type: string }

    SnippetCreateInput:
      type: object
      required: [type, source_type]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端可选指定 UUID
        page_id:
          type: string
          format: uuid
        type: { $ref: '#/components/schemas/SnippetType' }
        subtype: { type: string }
        title: { type: string }
        description: { type: string }
        text_content: { type: string, format: byte }
        text_format: { $ref: '#/components/schemas/SnippetTextFormat' }
        text_lang: { type: string }
        payload:
          type: object
          additionalProperties: true
        source_type: { $ref: '#/components/schemas/SnippetSourceType' }
        source_data:
          type: object
          additionalProperties: true
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        elements:
          type: array
          items: { $ref: '#/components/schemas/ElementInput' }

    SnippetUpdateInput:
      type: object
      description: |
        所有字段可选；缺省即不变。`version` 在 body 与 If-Match 头中至少提供一个，
        两者均存在时以 If-Match 头为准。
      properties:
        version:
          type: integer
          format: int64
          description: 兜底版本号（推荐改用 If-Match 头）
        page_id:
          type: string
          format: uuid
        title: { type: string }
        description: { type: string }
        text_content: { type: string, format: byte }
        text_format: { $ref: '#/components/schemas/SnippetTextFormat' }
        text_lang: { type: string }
        payload:
          type: object
          additionalProperties: true
        tag_ids:
          type: [array, 'null']
          description: nil = 不变；空数组 = 清空所有标签
          items: { type: string, format: uuid }
        elements:
          type: [array, 'null']
          description: nil = 不变；空数组 = 清空所有元素；非空 = 完整替换
          items: { $ref: '#/components/schemas/ElementInput' }

    SnippetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Snippet' }
        next_since:
          type: [string, 'null']
          format: date-time
          description: |
            仅同步模式（请求带 `since`）会出现，作为下次请求的 `since` 值。
            浏览模式下省略。

    # ---------- 文件 ----------
    File:
      type: object
      required: [id, plain_hash, cipher_hash, size_bytes, mime, created_at]
      properties:
        id: { type: string, format: uuid }
        plain_hash: { type: string, description: 明文 SHA-256 hex }
        cipher_hash: { type: string, description: 混淆字节 SHA-256 hex }
        size_bytes: { type: integer, format: int64 }
        mime: { type: string }
        has_thumbnail:
          type: boolean
          description: |
            服务端是否存有预生成的 JPEG 缩略图。仅中转上传时代（ADR-069 之前）的图片
            才会有：直传后 api 手里没有字节，要生成就得把整个对象从 R2 拉回来，
            恰好抵消掉直传省下的带宽；而客户端混淆后的字节本来也解不出图。
        created_at: { type: string, format: date-time }

    FileTicket:
      type: object
      required: [file, blob_url, expires_at]
      properties:
        file: { $ref: '#/components/schemas/File' }
        blob_url:
          type: string
          format: uri
          description: 边缘直读原始混淆字节的 URL，令牌已签在 `t` 查询参数里
        thumb_url:
          type: string
          format: uri
          description: 缩略图直读 URL；**缺省即没有缩略图**，客户端应回退到 `blob_url`
        expires_at:
          type: integer
          format: int64
          description: |
            两个 URL 共同的失效时刻（Unix 秒）。窗口很短（10 分钟），
            不要把票据跟着列表数据长期缓存 —— 过期后边缘回 401，重新取票即可。

    FileCheckInput:
      type: object
      required: [plain_hash]
      properties:
        plain_hash: { type: string, pattern: '^[0-9a-f]{64}$' }

    UploadIntentInput:
      type: object
      required: [plain_hash, cipher_hash, size_bytes]
      properties:
        plain_hash:  { type: string, pattern: '^[0-9a-f]{64}$', description: 明文 SHA-256，去重键 }
        cipher_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: 密文 SHA-256，同时是对象 key }
        size_bytes:  { type: integer, minimum: 1, description: 混淆**后**的字节数（= 实际传输量） }
        mime:        { type: string, default: application/octet-stream }

    UploadIntentResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: true 时只有 file 有值，其余字段缺省 —— 命中去重，无需传输
        file:
          oneOf:
            - $ref: '#/components/schemas/File'
            - type: 'null'
        intent_id:  { type: string, format: uuid }
        upload_url:
          type: string
          description: 边缘基址，恒非空；分片 PUT 到 `{upload_url}/v1/part/{n}`，单片 PUT 到 `{upload_url}/v1/single`
        token:
          type: string
          description: 'HMAC 上传令牌，格式 `base64url(payload).base64url(mac)`；以 `Authorization: Bearer` 送给边缘'
        part_size:  { type: integer, description: 分片大小，固定 8 MiB }
        part_count: { type: integer, description: 1 = 单片模式（不走 multipart） }

    UploadCommitInput:
      type: object
      required: [intent_id]
      properties:
        intent_id: { type: string, format: uuid }
        parts:
          type: array
          description: 单片模式留空；multipart 模式须覆盖 1..part_count，无缺号无重号
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag:        { type: string, description: 边缘 Worker 回传的分片 ETag（引号由服务端剥离） }

    FileCheckResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
        file:
          oneOf:
            - $ref: '#/components/schemas/File'
            - type: 'null'

    # ---------- URI 解析 ----------
    ParsedSnippet:
      type: object
      description: |
        与 SnippetCreateInput 字段对齐，可直接 POST 到 /snippets。
        - type=special：YouTube / Tweet / Gist 等专用解析器，subtype 为 provider 名
        - type=url：通用 OG 兜底解析（任何 http(s) 链接），无 subtype
      required: [type, payload, source_type, source_data]
      properties:
        type: { type: string, enum: [special, url] }
        subtype:
          type: string
          description: 仅 type=special 时出现；空字符串/省略表示无
        title: { type: string }
        description: { type: string }
        payload:
          type: object
          additionalProperties: true
        source_type: { type: string, enum: [upstream] }
        source_data:
          type: object
          additionalProperties: true

    ParseResponse:
      type: object
      required: [provider, resource_id, snippet, cached]
      properties:
        provider:
          type: string
          description: 已注册的 provider 名（按优先级匹配）。Phase 1.5 注册顺序：youtube → gist → reddit → url（generic OG 兜底）。
          examples: [youtube, gist, reddit, url]
        resource_id: { type: string, description: 该资源在 provider 命名空间内的稳定 ID }
        snippet: { $ref: '#/components/schemas/ParsedSnippet' }
        cached:
          type: boolean
          description: true 表示命中跨用户解析缓存，未触发上游调用

    # ---------- Passkey ----------
    PasskeyRegisterBeginResponse:
      type: object
      required: [publicKey, session_id]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialCreationOptions（W3C 规范，由 webauthn 库直接序列化）
        session_id:
          type: string
          description: 服务器给客户端的临时 ID；finish 时回传以索引 ceremony state

    PasskeyLoginBeginResponse:
      type: object
      required: [publicKey, session_id]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialRequestOptions
        session_id: { type: string }

    # ---------- 冲突归档 ----------
    SnippetConflictResponse:
      type: object
      required: [error, current_version, loser_snippet_id, loser_page_id]
      properties:
        error: { type: string, examples: ['version conflict'] }
        current_version:
          type: integer
          format: int64
          description: 服务端当前 snippet 的实际版本，客户端应用此 version 重试
        loser_snippet_id:
          type: string
          format: uuid
          description: 客户端提交内容已作为副本入冲突收件箱的 snippet ID
        loser_page_id:
          type: string
          format: uuid
          description: 用户的「冲突收件箱」系统页面 ID

    # ---------- 钱包 ----------
    Wallet:
      type: object
      required: [plan, credits_balance]
      properties:
        plan:
          type: string
          enum: [free, basic, standard, premium, maximum]
          description: 当前活跃订阅 tier；无活跃订阅时返 'free'
        credits_balance:
          type: integer
          format: int64
          description: SUM(delta) over credits_ledger；可为负（罚扣 / 退款冲销）

    CreditsGrantResponse:
      type: object
      required: [user_id, delta, balance_after, ledger_id]
      properties:
        user_id: { type: string, format: uuid }
        delta: { type: integer, format: int64 }
        balance_after:
          type: integer
          format: int64
          description: 该笔写入后的余额（写入瞬间的诊断字段；真实余额以 Wallet.credits_balance 为准）
        ledger_id: { type: string, format: uuid }

    # ---------- QR 扫码绑定 ----------
    QRCode:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: 8 位不易混淆字符（去掉 0/O/1/I/L）
        expires_at: { type: string, format: date-time }

    # ---------- Telegram 绑定 ----------
    TelegramBindingLink:
      type: object
      required: [token, url, expires_at]
      properties:
        token:
          type: string
          description: base64url(32B)，43 字符；单独回传供无法唤起 TG 时兜底复制
        url:
          type: string
          format: uri
          description: 由服务端拼装的 deep link，客户端直接渲染二维码
          example: https://t.me/SquyrrlBot?start=fT3n9-xQ...
        expires_at: { type: string, format: date-time }

    TelegramBinding:
      type: object
      required: [id, tg_user_id, user_id, device_id, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        tg_user_id: { type: integer, format: int64 }
        tg_username:
          type: string
          description: 绑定时由 Bot 带上，供 App 区分多个已绑账号；TG 侧改名不回流
        tg_name: { type: string }
        user_id: { type: string, format: uuid }
        device_id:
          type: string
          format: uuid
          description: 每个 TG 号对应一台 platform=telegram 的设备占位
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
