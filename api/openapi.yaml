openapi: 3.1.0
info:
  title: Squyrrl API
  version: 0.1.0
  description: |
    Squyrrl（箩筐）主 API 契约。本文件描述 Phase 1 已实现的 20 个端点。

    ## 认证模型

    - 客户端用邮箱 OTP 登录得到 `access_token`（1h）+ `refresh_token`（30d）。
    - 受保护端点要求 `Authorization: Bearer <access_token>` 请求头。
    - access token 过期后用 `/auth/refresh` 旋转出新的 access；refresh token 不旋转。
    - 任何 token 都仅以 SHA-256 哈希入库；明文 token 永不持久化。

    ## 同步并发控制

    - `snippets.version` 是单调自增的乐观锁。
    - 写入端点（PATCH / DELETE）必须携带 `If-Match: "<version>"` 头，否则 400 / 409。
    - 读取端点会返回 `ETag: "<version>"` 响应头。
    - 增量同步：`GET /snippets?since=<RFC3339>` 返回 `updated_at >= since` 的碎片，按时间升序，附带 `next_since` 用于下一次请求。
    - `?include_deleted=true` 让同步流包含软删除的碎片（带 `deleted_at`），客户端据此本地下架。

    ## 数据混淆

    - `snippets.text_content` 与未来的文件 blob 在客户端用 XChaCha20-Poly1305 + 应用静态密钥混淆后再上传。
    - 服务器只见混淆字节，不解密。在 JSON 中字段以 base64 出现（Go `[]byte` 默认编码）。
  contact:
    name: Squyrrl
    url: https://squyrrl.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:10260
    description: 开发环境（本机 Docker Compose）
  - url: https://api.squyrrl.com
    description: 生产环境（占位）

tags:
  - name: System
    description: 健康检查与平台信息
  - name: Auth
    description: 认证、会话、当前用户
  - name: Pages
    description: 用户的页面（碎片组织单元，1:N）
  - name: Tags
    description: 用户的标签（碎片组织单元，N:N）
  - name: Snippets
    description: 碎片 — 产品的核心实体
  - name: Files
    description: 文件存储（混淆字节）+ 跨用户去重
  - name: URIs
    description: URI 解析为特殊碎片（Phase 1.5：YouTube）
  - name: Telegram
    description: Telegram Bot 绑定与转发（用户端 + 内部端）
  - name: Passkey
    description: WebAuthn / Passkey 注册与无密码登录
  - name: QR
    description: 扫码绑定新设备
  - name: Wallet
    description: 用户订阅 plan + 代币余额（只读视图 + 内部充值端点）

# 全局默认要求 Bearer。公开端点用 security: [] 显式覆盖
security:
  - bearerAuth: []

# =============================================================================
# 端点
# =============================================================================
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: 健康检查
      description: 返回服务运行状态及数据库联通性。
      security: []
      responses:
        '200':
          description: 一切正常
          content:
            application/json:
              schema:
                type: object
                required: [status, env]
                properties:
                  status: { type: string, enum: [ok] }
                  env: { type: string, examples: [dev, test, prod] }
        '503':
          description: 数据库不通
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [down] }
                  db: { type: string }

  # ---------------------------------------------------------------- Auth
  /auth/email/request:
    post:
      operationId: requestEmailOtp
      tags: [Auth]
      summary: 请求邮箱登录验证码
      description: |
        生成 6 位数字 OTP，10 分钟有效，通过 Resend 投递。

        **204 不代表一定发出了邮件。** 三层防滥用中有两层以 204 静默生效，
        以免这个端点变成邮箱存在性与限流状态的探测器：
        - 按邮箱冷却：窗口内已有未消费的 OTP 则不重发（用户手上那封仍有效）。
          库里只存 SHA-256，明文取不回来，所以是「不做任何事」而非「重发」。
        - 全局发信预算：滚动 24 小时的发信量触顶时熔断，不建 OTP 也不发信，
          仅在服务端日志告警。此状态下真实用户同样无法登录，需人工介入。

        第三层按 IP 限流则返回 **429** —— 它拦的是明确的滥用，不涉及邮箱存在性，
        没有需要隐藏的信息，而客户端需要这个状态码才能实现退避。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: 已（尝试）发送；也可能因冷却或预算熔断而未实际发信 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: 该来源 IP 请求过于频繁，请退避后重试
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /auth/email/verify:
    post:
      operationId: verifyEmailOtp
      tags: [Auth]
      summary: 用 OTP 验证并签发会话
      description: 校验 OTP 成功后注册或登录用户，注册或更新设备，签发 access + refresh token。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, device]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$' }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: 旋转 access token
      description: 用 refresh_token 换发新的 access_token。refresh_token 本身不旋转。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 新 token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: 登出当前会话
      description: 撤销当前 access token 对应的会话；客户端应清空本地 token。
      responses:
        '204': { description: 已撤销 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: 当前用户信息
      responses:
        '200':
          description: 当前 user + device 视角
          content:
            application/json:
              schema:
                type: object
                required: [user, device_id]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  device_id: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Pages
  /pages:
    post:
      operationId: createPage
      tags: [Pages]
      summary: 创建页面
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageCreateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listPages
      tags: [Pages]
      summary: 列出当前用户的页面
      description: 按 `order_idx` 升序、`created_at` 升序返回；不含软删除条目。
      responses:
        '200':
          description: 页面列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Page' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pages/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: getPage
      tags: [Pages]
      summary: 拉取单个页面
      responses:
        '200':
          description: 页面
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updatePage
      tags: [Pages]
      summary: 更新页面
      description: "系统页面（`is_system: true`）禁止改名 / 改隐藏，但可调 `order_idx`。"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageUpdateInput' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 系统页面只读
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deletePage
      tags: [Pages]
      summary: 软删除页面
      description: |
        软删除该页面，并把该用户下指向它的所有未删除碎片的 `page_id` 置为 NULL，
        同时把这些碎片的 `version` 加 1（保证客户端通过同步流能看到变更）。
        系统页面禁止删除。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 系统页面只读
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Tags
  /tags:
    post:
      operationId: createTag
      tags: [Tags]
      summary: 创建标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagCreateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 标签名重复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listTags
      tags: [Tags]
      summary: 列出标签
      description: 按 `name` 升序返回。
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tag' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tags/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      operationId: updateTag
      tags: [Tags]
      summary: 重命名标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 同名标签已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: 删除标签
      description: 物理删除；通过外键级联自动清理 `snippet_tags` 关联。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Snippets
  /snippets:
    post:
      operationId: createSnippet
      tags: [Snippets]
      summary: 创建碎片
      description: |
        客户端可通过 `id` 字段携带本地生成的 UUID（用于离线写）。
        `tag_ids` 与 `page_id` 必须归属当前用户，否则返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetCreateInput' }
      responses:
        '201':
          description: 已创建
          headers:
            ETag:
              description: 当前 version，包在双引号里，可用作后续 If-Match
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listSnippets
      tags: [Snippets]
      summary: 列出 / 同步碎片
      description: |
        - 不传 `since`：浏览模式，按 `updated_at` 倒序，最多 `limit`（默认 100，上限 200）。
        - 传 `since`：同步模式，按 `updated_at` 升序，返回 `updated_at >= since` 的条目，附 `next_since` 供下次请求。
        - `include_deleted=true` 让结果包含软删除条目（`deleted_at` 非空）。
      parameters:
        - in: query
          name: page_id
          schema: { type: string, format: uuid }
        - in: query
          name: tag_id
          schema: { type: string, format: uuid }
        - in: query
          name: since
          description: RFC3339 时间戳；触发同步模式
          schema: { type: string, format: date-time }
        - in: query
          name: include_deleted
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: q
          description: |
            全文搜索关键字。Phase 1.5 仅对 `title` / `description` 做 ILIKE 单词包含匹配（大小写不敏感）。
            `text_content` 因后续将启用客户端混淆，不在服务端索引；客户端启用混淆后需要全文搜索时切换到本地索引方案。
          schema: { type: string }
      responses:
        '200':
          description: 碎片列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnippetList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /snippets/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: getSnippet
      tags: [Snippets]
      summary: 拉取单个碎片
      responses:
        '200':
          description: 碎片
          headers:
            ETag:
              description: 当前 version，可作为后续 If-Match
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: |
            该碎片处于**冻结期**（降级后超额数据，ADR-075）。它仍会出现在列表里，
            但详情不可读。响应体带 `restrict_until` —— 那是永久删除的倒计时。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaError' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateSnippet
      tags: [Snippets]
      summary: 更新碎片（乐观锁）
      description: |
        必须携带版本号，渠道有二选一：
        - HTTP 头 `If-Match: "<version>"`（推荐）
        - body 中的 `version` 字段（兜底）

        字段存在即更新；缺省字段保持不变。`tag_ids` 为空数组表示清空所有标签。
        type / source / 等不可变字段无法通过 PATCH 修改。
      parameters:
        - in: header
          name: If-Match
          schema: { type: string }
          description: 双引号包裹的版本号，例如 `"3"`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetUpdateInput' }
      responses:
        '200':
          description: 已更新
          headers:
            ETag:
              description: 自增后的 version
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: |
            该碎片超出当前方案，处在降级后的受限生命周期里（ADR-075）：
            宽限期与冻结期**都不可修改**。删除始终可用 —— 那是用户把自己
            拉回额度内的唯一手段，堵死它等于把人锁在一个无法自救的状态里。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            版本不匹配（乐观锁失败）。
            服务端会自动把客户端提交的内容作为「loser 副本」入用户的「冲突收件箱」系统页面（按需建立），
            响应里包含 `loser_snippet_id` 和 `loser_page_id` 便于客户端跳转展示。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnippetConflictResponse' }
    delete:
      operationId: deleteSnippet
      tags: [Snippets]
      summary: 软删除碎片
      description: |
        必须携带 `If-Match` 头。删除会设置 `deleted_at = now()` 并把 `version + 1`，
        以便客户端能通过同步流（include_deleted=true）感知到此次删除。
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
          description: 双引号包裹的版本号
      responses:
        '204': { description: 已删除 }
        '400':
          description: 缺少 If-Match 头
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本不匹配
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Files
  /files/check:
    post:
      operationId: checkFile
      tags: [Files]
      summary: 按 plain_hash 查重
      description: |
        客户端先把文件明文 SHA-256 提交，命中则直接拿到 file_id 复用，
        未命中再走 `POST /files/intent` 直传。节流量并实现跨用户去重（ADR-004）。
        去重前置于混淆：命中就连加密都省了（混淆用随机 nonce，密文每次不同，
        所以去重键只能是明文哈希）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileCheckInput' }
      responses:
        '200':
          description: 查重结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /files/intent:
    post:
      operationId: createUploadIntent
      tags: [Files]
      summary: 申请直传令牌（ADR-069）
      description: |
        直传三步的第一步。服务端查重，未命中则开 R2 multipart（`size_bytes > part_size` 时）、
        落一行 `upload_intents`、签发 HMAC 令牌。

        令牌里**签死了对象 key**，边缘 Worker 只认令牌里的值、不读 URL 路径 ——
        对象 key 是内容寻址的（`hex(cipher_hash)`），客户端若能自选 key 就能覆盖别人的文件。

        `exists=true` 时其余字段全部缺省：命中全局去重，一个字节都不用传。

        `upload_url` 恒为非空：生产指向 Worker 自定义域，dev 指向 api 自带的 `/edge`
        内嵌边缘（Worker 的 R2 binding 连不到 MinIO）。两者契约一致，客户端只需换终点。

        `SQUYRRL_UPLOAD_EDGE_BASE` / `SQUYRRL_UPLOAD_TOKEN_SECRET` 任一为空 ⇒ **503**
        （fail-closed）。**没有服务端中转回退**：漏配的代价是传不了文件，而不是让文件字节
        穿过 api 产生出网带宽费用。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadIntentInput' }
      responses:
        '200':
          description: 已命中去重，或已签发令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: |
            存储配额不足（ADR-075 ⑮）。三种情形共用这一个码，靠 `reason=storage_full`
            与文案区分：没买存储 / 单文件超上限 / 总量放不下。
            **判定发生在签发之前** —— 直传之后字节不再经过 api，这是服务端最后
            一次能说话的时刻；放到 commit 去查，超出的字节已经躺在 R2 上计费了。
            总量判据含**在途预留**（同用户未过期的 pending 意图），否则并发上传会一起超卖。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaError' }
        '413':
          description: 单文件超过 100MiB
        '503':
          description: 未配置上传令牌密钥，直传不可用

  /files/commit:
    post:
      operationId: commitUpload
      tags: [Files]
      summary: 收尾直传（ADR-069）
      description: |
        直传三步的第三步。合并分片（multipart 模式）、用 `StatObject` 核对 R2 中的
        **实际**字节数与申请时声明的是否一致（直传之后这是唯一能确认「真的传了这么多」
        的地方），一致才写 `files` 行。

        单片模式 `parts` 留空；multipart 模式必须交齐每片的 ETag，序号需覆盖
        `1..part_count` 且无缺号、无重号。

        本路径**不生成缩略图**：api 手里没有字节，拉回来会抵消掉直传省下的带宽；
        且混淆后的字节本就解不出图（见 ADR-050），故无行为损失。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCommitInput' }
      responses:
        '200':
          description: 已落库
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 上传意图不存在或不属于当前用户
        '409':
          description: 该上传意图已收尾或已作废

  /edge/v1/single:
    put:
      operationId: edgeUploadSingle
      tags: [Files]
      summary: 内嵌边缘 — 单片写入（仅 dev）
      description: |
        与 `server/edge/upload` 的 Cloudflare Worker **契约完全一致**的一份 Go 实现，
        挂在 api 自身。**仅在 `SQUYRRL_ENV != prod` 时注册**，生产环境本端点不存在 ——
        门闩按环境而非「是否配了 Worker」开，否则漏配一个环境变量就等于悄悄留下一条
        绕开 CDN、改吃服务器出网带宽的上传路径。

        存在的理由是 dev：本地接 MinIO，而 Worker 的 R2 binding 连不到 MinIO
        （`wrangler dev` 的本地 R2 是另一套存储，commit 时 `StatObject` 必然找不到对象）。

        认证用 `POST /files/intent` 签发的**上传令牌**，不是 Bearer access token。
        请求体为该对象的全部混淆字节；服务端校验大小与整体 `cipher_hash` 后才写入。

        上传令牌与下载令牌共用同一把密钥但用途不同，签名互不通用（见 `/edge/v1/blob`）。
      security: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
          description: '`Bearer <upload_token>`'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 已写入
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 令牌缺失、签名不符或已过期

  /edge/v1/part/{n}:
    put:
      operationId: edgeUploadPart
      tags: [Files]
      summary: 内嵌边缘 — 分片写入（仅 dev）
      description: |
        见 `/edge/v1/single`。`n` 为 1-based 分片序号，须落在 `1..part_count`。
        末片大小是余数，其余恒为 `part_size`；大小不符直接拒绝，不必等到 commit
        才拿一个 R2 的通用错误。

        multipart 下整体哈希跨请求算不出来，故改为逐片校验可选的 `X-Part-Hash`。
        两者都只挡传输损坏 —— `plain_hash` 与 `cipher_hash` 皆由客户端声称，
        而服务端没有混淆密钥（ADR-003），从来就无法验证二者对应。
      security: []
      parameters:
        - in: path
          name: n
          required: true
          schema: { type: integer, minimum: 1 }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
          description: '`Bearer <upload_token>`'
        - in: header
          name: X-Part-Hash
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: 该片密文的 SHA-256；提供则逐片校验
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 分片已写入，返回 ETag 供 commit 使用
          content:
            application/json:
              schema:
                type: object
                required: [part_number, etag]
                properties:
                  part_number: { type: integer }
                  etag: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 令牌缺失、签名不符或已过期

  /edge/v1/blob:
    get:
      operationId: edgeGetBlob
      tags: [Files]
      summary: 内嵌边缘 — 凭票读对象（仅 dev）
      description: |
        见 `/edge/v1/single` 的门闩说明，同样**仅在 `SQUYRRL_ENV != prod` 时注册**。
        生产由 `server/edge/upload` 的 Worker 在自定义域上承担同一条路由。

        认证用 `GET /files/{id}/ticket` 签发的**下载令牌**，不是 Bearer access token。
        令牌两种取法都认：`?t=` 查询参数或 `Authorization: Bearer`。

        **下载令牌与上传令牌签名互不通用**：用途字符串参与 HMAC 计算。否则一张下载票
        （没有 `sz`/`ch`）就能拿去打 `/edge/v1/single`，边缘会解出「期望 0 字节、
        无需校验哈希」，把那个内容寻址的 key 覆盖成空对象。

        `Content-Type` 取自令牌而非 R2 元数据：直传是用 binding 的 `put(key, body)` 写的、
        没带 httpMetadata，从 R2 读只会得到 `application/octet-stream`。
      security: []
      parameters:
        - in: query
          name: t
          schema: { type: string }
          description: '下载令牌；也可改用 `Authorization: Bearer <token>` 头'
        - in: header
          name: If-None-Match
          schema: { type: string }
          description: 命中则回 304，不传字节
      responses:
        '200':
          description: 对象字节
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
              description: '`private, max-age=31536000, immutable`（key 是内容寻址的，字节永不改变）'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304':
          description: 与 If-None-Match 一致，未变更
        '401':
          description: 令牌缺失、签名不符、用途不对或已过期
        '404':
          description: 对象不存在

  /files/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: getFileMetadata
      tags: [Files]
      summary: 获取文件元数据
      description: |
        仅返回 file 元数据 JSON（id / plain_hash / cipher_hash / size / mime），不传字节。
        只需要 mime / size 时用这个；要真取字节请用 `/files/{id}/ticket`，
        它在同一次往返里把元数据和边缘直读 URL 一起给你。
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{id}/ticket:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      operationId: issueFileTicket
      tags: [Files]
      summary: 签发下载票（边缘直读 URL）
      description: |
        返回文件元数据 + 一组**短期**边缘直读 URL（ADR-070）。api 在这里只查库和签名，
        不接触任何字节：字节走 `R2 → Worker → 客户端`，全程在 Cloudflare 内部。

        取代了此前 `GET /files/{id}/download` 与 `GET /files/{id}/thumb` 两个
        `io.Copy` 字节的端点 —— 那两个端点每次读都要把整个对象从 R2 拉进 api 再推给
        客户端，同一份流量付两次钱，而读的次数天然远多于写。

        `thumb_url` 缺省即「没有缩略图」，客户端据此 fallback 到 `blob_url` 拉原始混淆
        字节自行解混淆；不必再打一次 `/thumb` 去吃 404。

        令牌签在 URL 的 `t` 查询参数里，为的是 URL 自包含、能直接喂给 `<img src>`。
        代价是令牌会进访问日志，由很短的 TTL（10 分钟）兜住。

        未配置边缘时返回 503：**没有**回退到服务端中转的档位。
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: 本服务未启用边缘（`SQUYRRL_UPLOAD_EDGE_BASE` / `SQUYRRL_UPLOAD_TOKEN_SECRET` 缺失）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- URIs
  /uris/parse:
    post:
      operationId: parseUri
      tags: [URIs]
      summary: 解析 URI 为结构化碎片
      description: |
        服务端按已注册的 provider 顺序匹配 URI（Phase 1.5：YouTube oEmbed），
        命中后调上游 API 解析并写入跨用户共享缓存（ADR-005）。
        响应中的 `snippet` 字段可直接 POST 给 `/snippets` 创建特殊碎片。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uri]
              properties:
                uri: { type: string, format: uri }
      responses:
        '200':
          description: 解析成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: |
            credits 余额不足。cache 命中不收费；cache miss 时按 `SQUYRRL_PARSE_COST` 扣减（dev 默认 0 即不强制，生产推荐 2）。
            客户端应引导用户充值后重试，或读取 `/me/wallet` 查询当前余额。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 没有可用的 parser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: 上游 provider 错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Telegram Binding
  # 绑定载体是 Telegram deep link（2026-09-06）：App 为已登录用户签发一枚令牌，
  # 拼成 t.me/<bot>?start=<token> 渲染成二维码 / 可点链接；用户点开后 Bot 收到
  # /start <token> 并调内部端核销。用户不搬运任何字符串，令牌也不以人眼可读的
  # 形式出现，因而不会被顺手粘进群聊。
  /me/tg/bindings:
    get:
      operationId: listTelegramBindings
      tags: [Telegram]
      summary: 列出当前用户已绑定的 Telegram 账号
      description: 一个 Squyrrl 账户可以绑定多个 Telegram 账号。
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    items: { $ref: '#/components/schemas/PlatformBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/tg/binding/link:
    post:
      operationId: issueTelegramBindingLink
      tags: [Telegram]
      summary: 签发绑定 deep link
      description: |
        为当前用户签发一枚一次性令牌并拼成 `t.me/<bot>?start=<token>`。
        TTL 内重复调用返回同一枚令牌，避免用户正在扫码时二维码变化。
        令牌是 base64url(32B)，43 字符，落在 deep link payload 的 64 字符
        与 `[A-Za-z0-9_-]` 限制内。
      responses:
        '200':
          description: 绑定链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramBindingLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: 服务端未配置 `SQUYRRL_TG_BOT_USERNAME`，功能暂未开放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/tg/bindings/{id}:
    delete:
      operationId: deleteTelegramBinding
      tags: [Telegram]
      summary: 解除一个 Telegram 绑定
      description: 已保存的碎片保留；对应的 telegram 设备占位被标记撤销。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已解绑 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 绑定不存在或不属于当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/binding/consume:
    post:
      operationId: consumeTelegramBindingToken
      tags: [Telegram]
      summary: Bot 端：核销 deep link 令牌完成绑定
      description: |
        仅 Squyrrl Telegram Bot 调用，受 `X-Internal-Token` 头保护。
        Bot 收到 `/start <token>` 后提交令牌与它观察到的 TG 身份；
        核销是原子的，同一令牌重复提交只有第一次成功。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, tg_user_id]
              properties:
                token: { type: string }
                tg_user_id: { type: integer, format: int64 }
                tg_username: { type: string }
                tg_name: { type: string }
      responses:
        '200':
          description: 已绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformBinding' }
        '400':
          description: 令牌无效或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: |
            档位门槛拒绝。`reason=sync_required` 表示当前档位（免费档）不含三方绑定；
            `reason=plan_limit` 表示该平台可绑定的账号数已达上限。Bot 据此给出不同建议 ——
            前者要升级，后者可以先解绑一个。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaError' }
        '409':
          description: 该 tg_user_id 已绑定其它 Squyrrl 用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/binding/status:
    get:
      operationId: getTelegramBindingStatus
      tags: [Telegram]
      summary: Bot 端：查询某个 tg_user_id 的绑定状态
      description: |
        Bot 在把消息正文发过来之前先问一次，未绑定用户的内容因此不必经过
        创建碎片的请求体与日志。
      security:
        - internalToken: []
      parameters:
        - name: tg_user_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 绑定状态
          content:
            application/json:
              schema:
                type: object
                required: [bound]
                properties:
                  bound: { type: boolean }
                  tg_username: { type: string }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/binding/revoke:
    post:
      operationId: revokeTelegramBinding
      tags: [Telegram]
      summary: Bot 端：解除绑定（/unbind 命令）
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tg_user_id]
              properties:
                tg_user_id: { type: integer, format: int64 }
      responses:
        '204': { description: 已解绑 }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 该 tg_user_id 未绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/snippet:
    post:
      operationId: forwardTelegramSnippet
      tags: [Telegram]
      summary: Bot 端：以已绑定用户身份创建碎片
      description: |
        仅 Squyrrl Telegram Bot 调用，受 `X-Internal-Token` 头保护。
        服务端按 tg_user_id 找到对应 user_id 后创建。
        `text_content` 由 Bot 侧完成混淆（ADR-003/042），服务端不解读其字节。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tg_user_id, snippet]
              properties:
                tg_user_id: { type: integer, format: int64 }
                snippet:
                  type: object
                  properties:
                    type:
                      type: string
                      default: normal
                      enum: [uri, url, normal, special]
                    subtype:
                      type: string
                      description: special 类型的子类，如 telegram_contact / telegram_profile
                    title: { type: string }
                    description: { type: string }
                    text_content:
                      type: string
                      format: byte
                      description: 已混淆的字节（nonce|ciphertext|mac）
                    text_format: { type: string, default: plain }
                    payload:
                      type: object
                      description: TG 富元数据，含 forward_origin / contact / profile
                    file_ids:
                      type: array
                      items: { type: string, format: uuid }
                      description: 经 /internal/tg/files 上传后拿到的附件，按序挂成 elements
                    chat_id: { type: integer, format: int64 }
                    message_id: { type: integer, format: int64 }
      responses:
        '201':
          description: 碎片已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: tg_user_id 未绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/files/check:
    post:
      operationId: checkTelegramFile
      tags: [Telegram]
      summary: Bot 端：按明文哈希查全局去重表
      description: |
        与用户端 `/files/check` 语义相同，只是换一道守卫 —— `/files` 那组挂着
        Bearer 中间件，而 Bot 只有内部 token，没有用户身份。files 表本身是全局的
        （ADR-004），与 user 无关，因此复用同一个 service，没有第二套存储逻辑。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plain_hash]
              properties:
                plain_hash: { type: string, description: hex(sha256) }
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                type: object
                required: [exists]
                properties:
                  exists: { type: boolean }
                  file: { $ref: '#/components/schemas/File' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/tg/files:
    post:
      operationId: uploadTelegramFile
      tags: [Telegram]
      summary: Bot 端：上传已混淆的附件字节
      security:
        - internalToken: []
      parameters:
        - { name: X-Plain-Hash,  in: header, required: true, schema: { type: string } }
        - { name: X-Cipher-Hash, in: header, required: true, schema: { type: string } }
        - { name: X-Size-Bytes,  in: header, required: true, schema: { type: integer } }
        - { name: X-Mime,        in: header, required: false, schema: { type: string } }
        - name: X-TG-User-ID
          in: header
          required: false
          schema: { type: integer, format: int64 }
          description: |
            发起转发的 Telegram 用户。带上它，服务端才能在**读请求体之前**
            查这个账户的存储配额 —— 这条路径上账户此前要到建碎片那步才解析得出来，
            于是字节先落 R2、配额不足事后才暴露，留下一批已经开始计费的孤儿对象。
            缺省时跳过配额校验（兼容尚未升级的 Bot）。
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 已入库
          content:
            application/json:
              schema:
                type: object
                required: [file]
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '400':
          description: 头缺失，或收到的字节与声明的哈希/大小不符
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: 超过单文件 100MiB 上限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Wallet
  /me/export:
    get:
      operationId: exportMyData
      tags: [Account]
      summary: 整批导出我的云端数据
      description: |
        以 `squyrrl.local-backup` 信封（version 2）流式返回当前用户的页面与碎片，
        可直接被客户端导入本地库 —— 格式契约见 `docs/spec/backup-envelope.md`。

        存在的理由是 ADR-075 的降级生命周期：超额数据在 60 天后永久删除，
        在此之前必须有办法整批取走。逐条查看对一个有几万条碎片的人等于没有出口。

        **正文是混淆后的密文**（`content_obfuscated: true`），服务端不持有也不解密它；
        导入方负责解混淆。**冻结期的碎片不在导出里** —— 那一阶段的定义就是不可访问，
        而导出是访问的一种。

        不返回 `Content-Length`：内容是流式产出的。写入中途失败时连接会被中断，
        客户端拿到的是一份**解析失败**的截断 JSON，而不是一份静默残缺的备份。
      responses:
        '200':
          description: 导出文件
          content:
            application/json:
              schema:
                type: object
                required: [format, version, exported_at, pages, tags, snippets]
                properties:
                  format: { type: string, enum: ['squyrrl.local-backup'] }
                  version: { type: integer, enum: [2] }
                  exported_at: { type: string, format: date-time }
                  content_obfuscated: { type: boolean, enum: [true] }
                  pages: { type: array, items: { type: object } }
                  tags: { type: array, items: { type: object } }
                  snippets: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/wallet:
    get:
      operationId: getWallet
      tags: [Wallet]
      summary: 当前用户的三块增值服务状态
      description: |
        一次返回基础订阅、代币、云存储三块（ADR-075，三者互相独立购买）：
        - `plan` / `limits` = 当前档位与它的完整门槛表；无活跃订阅时为 `"free"`。
        - `usage` = 各项当前占用，与 `limits` 成对使用算出剩余额度。
        - `credits_balance` = `SUM(delta)` over `credits_ledger`，永不过期，不会为负。
        - `storage` = 独立购买的云存储配额与占用，**与 plan 无关**，未购买时配额为 0。

        客户端应在冷启动后缓存本响应用于本地预判（提前置灰超限操作），
        但**不可**据此跳过服务端校验 —— 两者的关系是「预判」与「裁决」。
      responses:
        '200':
          description: 钱包视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/admin/credits/grant:
    post:
      operationId: grantCredits
      tags: [Wallet]
      summary: 内部：给指定用户调整 credits 余额
      description: |
        受 X-Internal-Token 头保护。供管理后台 / 运营批处理调用。
        `delta` 可正可负；服务端用 advisory lock 串行化同一用户的并发写入，
        保证 `credits_ledger.balance_after` 列单调连续。

        **扣减不得使余额变负**：会导致负余额的请求返回 400 且不落流水（错误消息里带当前余额）。
        允许负余额会让此后每次 `Consume` 都因 `curBal < cost` 而 402，用户被永久锁死。
        需要清零时请按当前余额填精确值；服务端不做「夹到 0」处理，
        那会让流水里的 `delta` 与请求不一致，事后对账无从下手。

        注意：基础订阅**不再赠送 credits**（ADR-075，三块商品互相独立），
        因此本端点不再有来自订阅 webhook 的调用方。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, delta, reason]
              properties:
                user_id: { type: string, format: uuid }
                delta:
                  type: integer
                  format: int64
                  description: 正数入账，负数罚扣 / 退款冲销
                reason:
                  type: string
                  description: 流水原因，例如 'purchase' / 'admin_grant' / 'parse_uri' / 'refund'
                idempotency_key:
                  type: string
                  description: |
                    可选。同一个键重复提交只落一笔流水，后续请求原样返回首次结果并带 `replayed: true`。
                    支付回调**必须**传（网关重试是常态）；后台手工发放建议传（客服重复点提交是最常见的重复发放来源）。
      responses:
        '200':
          description: 流水记录已生成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditsGrantResponse' }
        '400':
          description: |
            扣减会使余额变负，或 `delta` 极端到令 int64 余额回绕。两种情况都不落流水。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 内部 token 缺失
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Passkey (WebAuthn)
  /auth/passkey/register/begin:
    post:
      operationId: passkeyRegisterBegin
      tags: [Passkey]
      summary: 已登录用户：发起 passkey 注册
      description: |
        返回 PublicKeyCredentialCreationOptions（W3C Web Authentication）+ session_id。
        客户端应调用 `navigator.credentials.create({ publicKey })`，
        把生成的 `PublicKeyCredential` 序列化后通过 `register/finish` 回传。
      responses:
        '200':
          description: 注册 ceremony 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyRegisterBeginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/passkey/register/finish:
    post:
      operationId: passkeyRegisterFinish
      tags: [Passkey]
      summary: 已登录用户：提交 passkey 凭据完成注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, response]
              properties:
                session_id: { type: string }
                response:
                  type: object
                  description: 客户端 PublicKeyCredential 的 JSON 序列化
                  additionalProperties: true
                name:
                  type: string
                  description: 用户给该凭据起的名字（"MacBook 内置 TouchID" 等）
      responses:
        '204': { description: 已绑定 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/passkey/login/begin:
    post:
      operationId: passkeyLoginBegin
      tags: [Passkey]
      summary: 公开：发起 passkey 登录（无密码）
      description: |
        服务端按 email 定位用户并发出 challenge。
        返回 PublicKeyCredentialRequestOptions + session_id；
        客户端调 `navigator.credentials.get({ publicKey })` 后回传到 `login/finish`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 登录 ceremony 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyLoginBeginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 用户未注册过 passkey 或邮箱不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/passkey/login/finish:
    post:
      operationId: passkeyLoginFinish
      tags: [Passkey]
      summary: 公开：提交 passkey assertion，签发会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, email, response, device]
              properties:
                session_id: { type: string }
                email: { type: string, format: email }
                response:
                  type: object
                  additionalProperties: true
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- QR 扫码绑定
  /auth/qr/start:
    post:
      operationId: qrStart
      tags: [QR]
      summary: 已登录设备：拿一个 90 秒有效的绑定码
      description: |
        客户端可把返回的 `code` 编码为二维码展示给新设备扫描，
        或直接让用户在新设备手动输入绑定码（推荐 8 字符不易混淆字符集）。
      responses:
        '200':
          description: 绑定码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QRCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/qr/redeem:
    post:
      operationId: qrRedeem
      tags: [QR]
      summary: 新设备：兑换绑定码 + 设备元数据 → 登录
      description: |
        与 `/auth/email/verify` / `/auth/passkey/login/finish` 共享 LoginResult 响应；
        签发到的 access/refresh token 与其它登录方式无差异。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device]
              properties:
                code:
                  type: string
                  minLength: 8
                  maxLength: 8
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 绑定码无效或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# =============================================================================
# 复用组件
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 仅供 Bot 等内部服务调用；与主 API 共享同一个秘密

  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证 / token 无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在或不归属当前用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- 通用 ----------
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 人可读的错误描述（中文） }

    QuotaError:
      type: object
      description: |
        所有 402 的统一载体（ADR-075）。字段**按 `reason` 分组填写**，
        用不到的一律省略 —— 同一个响应体里既有 `balance` 又有 `cap`，
        客户端就无从判断该读哪个、该把用户引导去充值还是去升级。
      required: [reason, error]
      properties:
        reason:
          type: string
          enum: [insufficient_credits, plan_limit, sync_required, data_restricted, storage_full]
          description: |
            机器可读的拒绝原因。`sync_required` 从 `plan_limit` 里单独拆出，
            因为它对应的引导完全不同（「升级以启用云同步」而非「数量已达上限」），
            且它是免费档用户最常撞到的一条。`data_restricted` 则是降级之后
            超额数据的生命周期：不是「你不能再加了」，而是「这件已经存在的东西
            你暂时动不了，且带截止日期」。
        error: { type: string, description: 人可读的中文描述，仅作兜底展示 }
        limit:
          type: string
          enum: [snippets, pages, tags, devices, bindings, hidden_pages, storage]
          description: 撞到的是哪一项门槛（plan_limit / sync_required）
        cap: { type: integer, description: 当前档位该项的上限 }
        current: { type: integer, description: 当前用量；批量写入时是「加完之后」的值 }
        plan: { type: string, description: 用户当前档位 }
        required_plan:
          type: string
          description: |
            能满足本次操作的最低档位。**为空表示最高档也不够** ——
            客户端必须区分这两种情况，否则会把「你已经是至尊版了，这条确实放不下」
            显示成一个点了没有任何变化的「请升级」按钮。
        balance: { type: integer, format: int64, description: 当前代币余额（insufficient_credits） }
        required: { type: integer, format: int64, description: 本次操作所需代币（insufficient_credits） }
        quota_bytes:
          type: integer
          format: int64
          description: storage_full 专用：已购买的云存储总量
        used_bytes:
          type: integer
          format: int64
          description: storage_full 专用：当前占用（含在途预留之外的已落库部分）
        needed_bytes:
          type: integer
          format: int64
          description: storage_full 专用：本次上传需要的字节
        restrict_stage:
          type: string
          enum: [grace, frozen]
          description: |
            data_restricted 专用。`grace` = 可读可删、不可改；
            `frozen` = 列表仍可见但详情不可读。
        restrict_until:
          type: string
          format: date-time
          description: |
            当前阶段的结束时刻。冻结期结束即**永久删除** ——
            这是一个真实的倒计时，客户端应当照实显示。

    # ---------- 认证 ----------
    User:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email:
          type: [string, 'null']
          format: email
        handle:
          type: [string, 'null']
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Device:
      type: object
      required: [id, user_id, name, platform, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        last_seen_at: { type: string, format: date-time }

    Platform:
      type: string
      enum: [ios, android, macos, windows, linux, web, browser, telegram, wechat]

    DeviceInput:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        platform: { $ref: '#/components/schemas/Platform' }

    TokenPair:
      type: object
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }

    LoginResult:
      type: object
      required: [user, device, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    # ---------- 页面 ----------
    Page:
      type: object
      required: [id, name, is_hidden, is_system, order_idx, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_hidden: { type: boolean }
        is_system: { type: boolean }
        order_idx: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PageCreateInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端可选指定 UUID（离线生成）
        name: { type: string, minLength: 1, maxLength: 100 }
        is_hidden: { type: boolean, default: false }
        order_idx: { type: integer, default: 0 }

    PageUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        is_hidden: { type: boolean }
        order_idx: { type: integer }

    # ---------- 标签 ----------
    Tag:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TagCreateInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端可选指定 UUID
        name: { type: string, minLength: 1, maxLength: 50 }

    # ---------- 碎片 ----------
    SnippetType:
      type: string
      enum: [uri, url, normal, special]

    SnippetTextFormat:
      type: string
      enum: [plain, markdown, code]

    SnippetSourceType:
      type: string
      enum: [device, upstream]

    Snippet:
      type: object
      required:
        - id
        - type
        - text_format
        - payload
        - source_type
        - source_data
        - version
        - tag_ids
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        restriction:
          type: string
          enum: [grace, frozen]
          description: |
            降级后超额数据的阶段（ADR-075）。**字段缺席表示正常** ——
            正常碎片占绝大多数，为它们各带一个空串是纯粹的带宽浪费。
            `grace`：可读、可删，不可修改；`frozen`：**仍会出现在列表里**，
            但 `GET /snippets/{id}` 返回 402。列出而不隐藏是有意的：
            藏起来用户会以为数据已经没了并停止行动，列出来则那串条目
            本身就是最有效的续费提醒。
        page_id:
          type: [string, 'null']
          format: uuid
        type: { $ref: '#/components/schemas/SnippetType' }
        subtype:
          type: [string, 'null']
          description: type=special 时的具体子类，例如 tweet / apk / gist / youtube
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        text_content:
          type: string
          format: byte
          description: 客户端混淆后的字节，base64 编码。服务器不解密
        text_format: { $ref: '#/components/schemas/SnippetTextFormat' }
        text_lang:
          type: [string, 'null']
          description: 仅 text_format=code 时有意义
        payload:
          type: object
          additionalProperties: true
          description: "类型相关字段，例如 url 碎片的 `{url: ...}` 或推文解析数据"
        source_type: { $ref: '#/components/schemas/SnippetSourceType' }
        source_data:
          type: object
          additionalProperties: true
          description: |
            device 时形如 `{device_id, name, platform}`；
            upstream 时形如 `{provider, author_handle, author_avatar_url, ...}`
        version:
          type: integer
          format: int64
          description: 单调自增；写入时作乐观锁
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        elements:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: [string, 'null']
          format: date-time

    Element:
      type: object
      required: [id, file_id, order_idx, created_at]
      properties:
        id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        order_idx: { type: integer }
        alt_text:
          type: [string, 'null']
        created_at: { type: string, format: date-time }

    ElementInput:
      type: object
      required: [file_id]
      properties:
        file_id: { type: string, format: uuid }
        order_idx: { type: integer, default: 0 }
        alt_text: { type: string }

    SnippetCreateInput:
      type: object
      required: [type, source_type]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端可选指定 UUID
        page_id:
          type: string
          format: uuid
        type: { $ref: '#/components/schemas/SnippetType' }
        subtype: { type: string }
        title: { type: string }
        description: { type: string }
        text_content: { type: string, format: byte }
        text_format: { $ref: '#/components/schemas/SnippetTextFormat' }
        text_lang: { type: string }
        payload:
          type: object
          additionalProperties: true
        source_type: { $ref: '#/components/schemas/SnippetSourceType' }
        source_data:
          type: object
          additionalProperties: true
        tag_ids:
          type: array
          items: { type: string, format: uuid }
        elements:
          type: array
          items: { $ref: '#/components/schemas/ElementInput' }

    SnippetUpdateInput:
      type: object
      description: |
        所有字段可选；缺省即不变。`version` 在 body 与 If-Match 头中至少提供一个，
        两者均存在时以 If-Match 头为准。
      properties:
        version:
          type: integer
          format: int64
          description: 兜底版本号（推荐改用 If-Match 头）
        page_id:
          type: string
          format: uuid
          description: 移动到该页面。**不支持传 null 表示移出** —— 见 clear_page。
        clear_page:
          type: boolean
          description: |
            把碎片移出页面，回到「全部碎片」。
            需要独立布尔而不是 `page_id: null`：ADR-023 定下 PATCH 不支持显式
            null 清空（标准库 JSON 分不清缺席与 null，解码后都是 nil 指针）。
            `tag_ids` 用 `*[]T` 绕过了这个限制，而 page_id 是标量，没有这个余地。
            两者同传时以 clear_page 为准。
        title: { type: string }
        description: { type: string }
        text_content: { type: string, format: byte }
        text_format: { $ref: '#/components/schemas/SnippetTextFormat' }
        text_lang: { type: string }
        payload:
          type: object
          additionalProperties: true
        tag_ids:
          type: [array, 'null']
          description: nil = 不变；空数组 = 清空所有标签
          items: { type: string, format: uuid }
        elements:
          type: [array, 'null']
          description: nil = 不变；空数组 = 清空所有元素；非空 = 完整替换
          items: { $ref: '#/components/schemas/ElementInput' }

    SnippetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Snippet' }
        next_since:
          type: [string, 'null']
          format: date-time
          description: |
            仅同步模式（请求带 `since`）会出现，作为下次请求的 `since` 值。
            浏览模式下省略。

    # ---------- 文件 ----------
    File:
      type: object
      required: [id, plain_hash, cipher_hash, size_bytes, mime, created_at]
      properties:
        id: { type: string, format: uuid }
        plain_hash: { type: string, description: 明文 SHA-256 hex }
        cipher_hash: { type: string, description: 混淆字节 SHA-256 hex }
        size_bytes: { type: integer, format: int64 }
        mime: { type: string }
        has_thumbnail:
          type: boolean
          description: |
            服务端是否存有预生成的 JPEG 缩略图。仅中转上传时代（ADR-069 之前）的图片
            才会有：直传后 api 手里没有字节，要生成就得把整个对象从 R2 拉回来，
            恰好抵消掉直传省下的带宽；而客户端混淆后的字节本来也解不出图。
        created_at: { type: string, format: date-time }

    FileTicket:
      type: object
      required: [file, blob_url, expires_at]
      properties:
        file: { $ref: '#/components/schemas/File' }
        blob_url:
          type: string
          format: uri
          description: 边缘直读原始混淆字节的 URL，令牌已签在 `t` 查询参数里
        thumb_url:
          type: string
          format: uri
          description: 缩略图直读 URL；**缺省即没有缩略图**，客户端应回退到 `blob_url`
        expires_at:
          type: integer
          format: int64
          description: |
            两个 URL 共同的失效时刻（Unix 秒）。窗口很短（10 分钟），
            不要把票据跟着列表数据长期缓存 —— 过期后边缘回 401，重新取票即可。

    FileCheckInput:
      type: object
      required: [plain_hash]
      properties:
        plain_hash: { type: string, pattern: '^[0-9a-f]{64}$' }

    UploadIntentInput:
      type: object
      required: [plain_hash, cipher_hash, size_bytes]
      properties:
        plain_hash:  { type: string, pattern: '^[0-9a-f]{64}$', description: 明文 SHA-256，去重键 }
        cipher_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: 密文 SHA-256，同时是对象 key }
        size_bytes:  { type: integer, minimum: 1, description: 混淆**后**的字节数（= 实际传输量） }
        mime:        { type: string, default: application/octet-stream }

    UploadIntentResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
          description: true 时只有 file 有值，其余字段缺省 —— 命中去重，无需传输
        file:
          oneOf:
            - $ref: '#/components/schemas/File'
            - type: 'null'
        intent_id:  { type: string, format: uuid }
        upload_url:
          type: string
          description: 边缘基址，恒非空；分片 PUT 到 `{upload_url}/v1/part/{n}`，单片 PUT 到 `{upload_url}/v1/single`
        token:
          type: string
          description: 'HMAC 上传令牌，格式 `base64url(payload).base64url(mac)`；以 `Authorization: Bearer` 送给边缘'
        part_size:  { type: integer, description: 分片大小，固定 8 MiB }
        part_count: { type: integer, description: 1 = 单片模式（不走 multipart） }

    UploadCommitInput:
      type: object
      required: [intent_id]
      properties:
        intent_id: { type: string, format: uuid }
        parts:
          type: array
          description: 单片模式留空；multipart 模式须覆盖 1..part_count，无缺号无重号
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number: { type: integer, minimum: 1 }
              etag:        { type: string, description: 边缘 Worker 回传的分片 ETag（引号由服务端剥离） }

    FileCheckResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
        file:
          oneOf:
            - $ref: '#/components/schemas/File'
            - type: 'null'

    # ---------- URI 解析 ----------
    ParsedSnippet:
      type: object
      description: |
        与 SnippetCreateInput 字段对齐，可直接 POST 到 /snippets。
        - type=special：YouTube / Tweet / Gist 等专用解析器，subtype 为 provider 名
        - type=url：通用 OG 兜底解析（任何 http(s) 链接），无 subtype
      required: [type, payload, source_type, source_data]
      properties:
        type: { type: string, enum: [special, url] }
        subtype:
          type: string
          description: 仅 type=special 时出现；空字符串/省略表示无
        title: { type: string }
        description: { type: string }
        payload:
          type: object
          additionalProperties: true
        source_type: { type: string, enum: [upstream] }
        source_data:
          type: object
          additionalProperties: true

    ParseResponse:
      type: object
      required: [provider, resource_id, snippet, cached]
      properties:
        provider:
          type: string
          description: 已注册的 provider 名（按优先级匹配）。Phase 1.5 注册顺序：youtube → gist → reddit → url（generic OG 兜底）。
          examples: [youtube, gist, reddit, url]
        resource_id: { type: string, description: 该资源在 provider 命名空间内的稳定 ID }
        snippet: { $ref: '#/components/schemas/ParsedSnippet' }
        cached:
          type: boolean
          description: true 表示命中跨用户解析缓存，未触发上游调用

    # ---------- Passkey ----------
    PasskeyRegisterBeginResponse:
      type: object
      required: [publicKey, session_id]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialCreationOptions（W3C 规范，由 webauthn 库直接序列化）
        session_id:
          type: string
          description: 服务器给客户端的临时 ID；finish 时回传以索引 ceremony state

    PasskeyLoginBeginResponse:
      type: object
      required: [publicKey, session_id]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialRequestOptions
        session_id: { type: string }

    # ---------- 冲突归档 ----------
    SnippetConflictResponse:
      type: object
      required: [error, current_version, loser_snippet_id, loser_page_id]
      properties:
        error: { type: string, examples: ['version conflict'] }
        current_version:
          type: integer
          format: int64
          description: 服务端当前 snippet 的实际版本，客户端应用此 version 重试
        loser_snippet_id:
          type: string
          format: uuid
          description: 客户端提交内容已作为副本入冲突收件箱的 snippet ID
        loser_page_id:
          type: string
          format: uuid
          description: 用户的「冲突收件箱」系统页面 ID

    # ---------- 钱包 ----------
    Wallet:
      type: object
      required: [plan, plan_status, credits_balance, limits, usage, storage]
      description: |
        三块增值服务各自的状态（ADR-075）。必须一起下发：客户端要在同一处解释
        「为什么这个操作被拒了」，只拿到其中两块就无法区分 402 是余额不足还是配额已满。
      properties:
        plan:
          type: string
          enum: [free, basic, standard, premium, maximum]
          description: |
            当前**生效**的档位。扣款失败但仍在宽限期内（ADR-075 ⑭）时，这里仍是
            原档位而非 free —— 宽限期内服务不降级。
        plan_status:
          type: string
          enum: [none, active, past_due]
          description: |
            这个档位是怎么来的。`past_due` = 扣款失败但仍在宽限期内。
            客户端应据此提前提醒续费：不提醒的话，用户唯一的信号就是宽限期结束
            那天功能突然消失，而那时已经来不及了。
        grace_until:
          type: string
          format: date-time
          description: |
            仅 `plan_status = past_due` 时出现。宽限期到此为止，之后按 free 处理 ——
            而 free 在客户端意味着数据分流切回本地（ADR-075 ⑧）。
        credits_balance:
          type: integer
          format: int64
          description: |
            SUM(delta) over credits_ledger，永不过期。**不会为负** —— 会使余额变负的
            扣减在 /internal/admin/credits/grant 处即被拒（400）。
        limits:
          $ref: '#/components/schemas/PlanLimits'
        usage:
          $ref: '#/components/schemas/PlanUsage'
        storage:
          $ref: '#/components/schemas/StorageStatus'

    PlanLimits:
      type: object
      description: |
        当前档位的门槛表。与 usage 成对使用，客户端据此在本地预判
        （到达上限时提前置灰新建按钮，而不是等服务端回 402），
        以及在匿名数据迁移界面实时计算「还能再选多少条」。
      properties:
        key: { type: string }
        price_usd_monthly: { type: integer, description: 月付价；年付 = 该值 × 10 }
        sync:
          type: boolean
          description: |
            碎片是否同步到服务端。free 为 false —— 免费档是纯本地应用，
            服务端不存它的任何碎片。为 false 时 devices / trash_days 无意义。
        snippets: { type: integer }
        pages: { type: integer }
        tags: { type: integer }
        devices: { type: integer, description: sync 为 false 时为 0，表示「不适用」而非「零台」 }
        bindings_per_platform: { type: integer, description: 每个平台各自计数，不是总数 }
        trash_days: { type: integer }
        hidden_pages: { type: boolean }
        rules: { type: boolean }
        import: { type: boolean }
        parse_priority: { type: boolean }

    PlanUsage:
      type: object
      description: 各项资源的当前占用，字段与 PlanLimits 一一对应。
      properties:
        snippets: { type: integer }
        pages: { type: integer, description: 系统页面（冲突收件箱）不计入 }
        tags: { type: integer }
        devices: { type: integer }

    StorageStatus:
      type: object
      description: |
        云存储与 plan **完全无关** —— 它来自独立购买、可叠加的 storage 订阅。
        未购买时 quota_bytes 为 0，此时任何文件上传都会被拒。
        占用按「每个引用者全额计」口径：同一用户的多条碎片引用同一文件只算一次，
        跨用户各算各的（全局去重省下的字节留在成本侧）。
      properties:
        quota_bytes: { type: integer, format: int64 }
        used_bytes: { type: integer, format: int64 }

    CreditsGrantResponse:
      type: object
      required: [user_id, delta, balance_after, ledger_id]
      properties:
        user_id: { type: string, format: uuid }
        delta: { type: integer, format: int64 }
        balance_after:
          type: integer
          format: int64
          description: 该笔写入后的余额（写入瞬间的诊断字段；真实余额以 Wallet.credits_balance 为准）
        ledger_id: { type: string, format: uuid }
        replayed:
          type: boolean
          description: |
            为 true 表示本次请求命中了既有的 `idempotency_key`，没有产生新流水，
            返回的是首次写入的结果。两种情况都算成功，但含义不同：
            调用方据此区分「刚扣成功」与「之前就扣过了」。

    # ---------- QR 扫码绑定 ----------
    QRCode:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: 8 位不易混淆字符（去掉 0/O/1/I/L）
        expires_at: { type: string, format: date-time }

    # ---------- Telegram 绑定 ----------
    TelegramBindingLink:
      type: object
      required: [token, url, expires_at]
      properties:
        token:
          type: string
          description: base64url(32B)，43 字符；单独回传供无法唤起 TG 时兜底复制
        url:
          type: string
          format: uri
          description: 由服务端拼装的 deep link，客户端直接渲染二维码
          example: https://t.me/SquyrrlBot?start=fT3n9-xQ...
        expires_at: { type: string, format: date-time }

    PlatformBinding:
      type: object
      description: |
        用户绑定的一个三方账号。字段一律平台无关 —— 这张列表将来会同时容纳
        Telegram / 微信等多个平台的记录。注意与 /internal/tg 上那套 `tg_user_id`
        形状的区别：后者是 Bot 与 API 之间的私有协议，说 Telegram 的母语。
      required: [id, platform, platform_user_id, user_id, device_id, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        platform:
          type: string
          enum: [telegram]
          description: 目前只有 telegram；接入新平台时在此扩充
        platform_user_id:
          type: string
          description: |
            该平台上的账号 ID，**字符串**。Telegram 的恰好是数字，
            微信 openid 不是 —— 用字符串承载才不必在接第二个平台时改契约。
        platform_username:
          type: string
          description: 绑定时由平台侧带上，供 App 区分多个已绑账号；对方改名不回流
        platform_name: { type: string }
        user_id: { type: string, format: uuid }
        device_id:
          type: string
          format: uuid
          description: 每个三方号对应一台同名 platform 的设备占位
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
